<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Day Oneness</title>
<meta name="application-name" content="Day Oneness">
<meta name="apple-mobile-web-app-title" content="Day Oneness">
<meta name="theme-color" content="#2b5a47">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: 一日を中心に、画面幅で S=縦積み / M=週ストリップ+2カラム / L=月カレンダー+2カラム */
:root{
  --bg:#e8ece6; --surface:#fbfbf8; --surface-2:#f1f4ef; --line:#dce3d9;
  --fg:#1e2a24; --muted:#67746c; --accent:#2b5a47; --accent-fg:#ffffff; --accent-soft:#dde8e1;
  --read:#33634d; --read-soft:#e0ebe4; --watch:#94562b; --watch-soft:#f2e5d9;
  --done:#474d8a; --done-soft:#e5e6f4; --thought:#773d6b; --thought-soft:#f2e3ee;
  --photo:#e2e7df; --danger:#b3412f; --scrim:rgba(20,30,25,.38);
  --font:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,system-ui,sans-serif;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131816; --surface:#1b221f; --surface-2:#212a26; --line:#2e3934;
  --fg:#e5ebe7; --muted:#94a199; --accent:#7fb89c; --accent-fg:#0f1f18; --accent-soft:#233a2f;
  --read:#8cc2a6; --read-soft:#21352b; --watch:#e3a576; --watch-soft:#38291e;
  --done:#afb3ef; --done-soft:#282b45; --thought:#e3a8d4; --thought-soft:#382536;
  --photo:#26302b; --danger:#ef8a78; --scrim:rgba(0,0,0,.55); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#131816; --surface:#1b221f; --surface-2:#212a26; --line:#2e3934;
  --fg:#e5ebe7; --muted:#94a199; --accent:#7fb89c; --accent-fg:#0f1f18; --accent-soft:#233a2f;
  --read:#8cc2a6; --read-soft:#21352b; --watch:#e3a576; --watch-soft:#38291e;
  --done:#afb3ef; --done-soft:#282b45; --thought:#e3a8d4; --thought-soft:#382536;
  --photo:#26302b; --danger:#ef8a78; --scrim:rgba(0,0,0,.55); color-scheme:dark }

/* テーマカラー（設定で選んだときだけ適用。読んだ=緑・観た=茶はどのテーマでも共通） */
html:root[data-palette]:not([data-palette="night"]){--accent-fg:#ffffff;--read:#33634d;--read-soft:#e0ebe4;--watch:#94562b;--watch-soft:#f2e5d9;--done:#474d8a;--done-soft:#e5e6f4;--thought:#773d6b;--thought-soft:#f2e3ee;--danger:#b3412f;--scrim:rgba(20,30,25,.38);color-scheme:light}
html:root[data-palette="sage"]{--bg:#e9ede8;--surface:#fffffa;--surface-2:#f1f4ef;--line:#dce3d9;--fg:#1e2a24;--muted:#67746c;--accent:#285847;--accent-soft:#dde8e1;--photo:#e2e7df}
html:root[data-palette="ink"]{--bg:#e9eff7;--surface:#fbfdff;--surface-2:#f0f4fa;--line:#d8e1ec;--fg:#1b2533;--muted:#617084;--accent:#244b78;--accent-soft:#dde6f2;--photo:#e6edf6}
html:root[data-palette="amber"]{--bg:#f4eadb;--surface:#fffcf4;--surface-2:#f8f1e6;--line:#eadcc8;--fg:#2e2418;--muted:#78685a;--accent:#8b4e22;--accent-soft:#f1e1cf;--photo:#f1e6d8}
html:root[data-palette="cobalt"]{--bg:#dceaff;--surface:#ffffff;--surface-2:#eef4ff;--line:#d3e0f5;--fg:#14213a;--muted:#5b6983;--accent:#1553db;--accent-soft:#dbe7ff;--photo:#dce8fd}
html:root[data-palette="rose"]{--bg:#f1e7e8;--surface:#fffdfd;--surface-2:#f8f0f1;--line:#eadadd;--fg:#2d2023;--muted:#78656a;--accent:#8a4256;--accent-soft:#f2e0e5;--photo:#f1e5e7}
html:root[data-palette="night"]{--bg:#171e29;--surface:#232b3a;--surface-2:#1c2432;--line:#333d50;--fg:#e6ebf3;--muted:#9aa5b7;--accent:#afc7f3;--accent-fg:#142036;--accent-soft:#2d3b56;--read:#8cc2a6;--read-soft:#22352d;--watch:#e3a576;--watch-soft:#3a2b20;--done:#b3b7f0;--done-soft:#2b2e48;--thought:#e3a8d4;--thought-soft:#3a2638;--photo:#1b2230;--danger:#ef8a78;--scrim:rgba(0,0,0,.55);color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}

.app{position:relative;z-index:1;max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(118px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){.app{padding-block:0 100px}}

/* ヘッダー */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 12px}
.hd-date{display:flex;align-items:baseline;gap:10px;min-width:0}
.hd-date h1{margin:0;font-size:1.6rem;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.dow{color:var(--muted);font-weight:500}
.today-pill{align-self:center;margin-left:4px;font-size:.8rem;font-weight:700;line-height:1;padding:8px 16px;border-radius:999px;letter-spacing:.04em;white-space:nowrap;background:var(--accent-soft);color:var(--accent)}
.today-pill.is-today{cursor:default}
.today-pill:not(.is-today){background:var(--accent);color:var(--accent-fg)}
.hd-actions{display:flex;align-items:center;gap:2px}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:10px;color:var(--fg);position:relative}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn.has-alert::after{content:"";position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--watch)}
.text-btn{height:40px;padding:0 10px;border-radius:10px;font-weight:700;color:var(--accent)}
.text-btn:hover{background:var(--surface-2)}
@media (min-width:1024px){.only-sm{display:none!important}}

/* 週ストリップ（M） */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px;margin-bottom:12px}
@media (min-width:600px){.week{gap:4px;padding:8px}}
@media (min-width:1024px){.week{display:none}}
.wk-day{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 7px;border-radius:var(--r-sm);color:var(--muted)}
.wk-day b{font-size:1.15rem;color:var(--fg);font-weight:700}
.wk-day small{font-size:.72rem}
.wk-day:hover{background:var(--surface-2)}
.wk-day.is-sel{background:var(--accent);color:var(--accent-fg)}
.wk-day.is-sel b{color:var(--accent-fg)}
.dots{display:flex;gap:3px;height:5px}
.dot{width:5px;height:5px;border-radius:50%}
.dot.ev{background:var(--accent)} .dot.en{background:var(--watch)}
.wk-day.is-sel .dot{background:var(--accent-fg)}

/* お知らせ */
.notice{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surface-2);border:1px dashed var(--line);border-radius:var(--r-sm);padding:8px 12px;margin-bottom:12px;font-size:.85rem;color:var(--muted)}
.notice button{font-weight:700;color:var(--accent);font-size:.85rem}

/* レイアウト */
.layout{display:grid;gap:12px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:600px){.layout{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr)}}
@media (min-width:1024px){.layout{grid-template-columns:300px minmax(0,.9fr) minmax(0,1.35fr)}}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
@media (min-width:600px){.pane{min-height:420px}}
.cal-pane{display:none}
@media (min-width:1024px){.cal-pane{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}}
.pane-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.pane-head h2{margin:0;font-size:1.1rem;font-weight:700}
.pane-add{display:none;align-items:center;gap:4px;font-size:.82rem;font-weight:700;color:var(--accent);padding:6px 8px;border-radius:8px}
.pane-add .ic{width:15px;height:15px}
.pane-add:hover{background:var(--surface-2)}
@media (min-width:600px){.pane-add{display:inline-flex}}

/* スケジュール */
.sched{list-style:none;margin:0;padding:0}
.sched li+li{border-top:1px solid var(--line)}
.sched button{width:100%;display:grid;grid-template-columns:56px minmax(0,1fr);align-items:baseline;gap:8px;text-align:left;padding:11px 4px;border-radius:8px}
.sched button:hover{background:var(--surface-2)}
.sched .t{color:var(--muted);font-size:.88rem}
.sched .t.allday{font-size:.75rem;font-weight:700;color:var(--read)}
.sched .ttl{font-weight:700;overflow-wrap:anywhere}
.sched .memo{display:block;font-weight:400;font-size:.82rem;color:var(--muted)}
.sched .linked{font-size:.7rem;font-weight:700;color:var(--watch);margin-left:6px}
.empty{color:var(--muted);font-size:.88rem;padding:12px 4px}

/* 記録：カード（読んだ・観た） */
.records{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--muted)}
.card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-head h3{margin:0;font-size:1rem;font-weight:700;overflow-wrap:anywhere}
.card p{margin:0;color:var(--fg);opacity:.85;font-size:.9rem;overflow-wrap:anywhere;white-space:pre-wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:6px;letter-spacing:.03em}
.chip .ic{width:14px;height:14px}
.chip.read{background:var(--read-soft);color:var(--read)}
.chip.watch{background:var(--watch-soft);color:var(--watch)}
.chip.done{background:var(--done-soft);color:var(--done)}
.chip.thought{background:var(--thought-soft);color:var(--thought)}
.thumb{display:block;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:8px;overflow:hidden;background:var(--photo);margin-top:2px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}

/* 記録：リスト（やれたこと・思ったこと） */
.notes{display:grid;gap:14px;margin-top:6px}
@media (min-width:1024px){.notes.two{grid-template-columns:1fr 1fr}}
.note-group ul{list-style:none;margin:6px 0 0;padding:0}
.note-group li button{width:100%;display:flex;gap:10px;text-align:left;padding:7px 4px;border-radius:8px;font-size:.92rem;overflow-wrap:anywhere}
.note-group li button:hover{background:var(--surface-2)}
.note-group li button::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;margin-top:.62em;background:currentColor;opacity:.5}
.note-group.done li button::before{background:var(--done);opacity:1}
.note-group.thought li button::before{background:var(--thought);opacity:1}
.section-sep{height:1px;background:var(--line);margin:6px 0 2px}

/* 月カレンダー */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-head h2{margin:0;font-size:1.05rem;font-weight:700}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-dow{font-size:.75rem;color:var(--muted);padding:4px 0}
.cal-day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0 4px;border-radius:9px;font-size:.88rem}
.cal-day:hover{background:var(--surface-2)}
.cal-day .num{width:30px;height:30px;display:grid;place-items:center;border-radius:8px}
.cal-day.is-today .num{box-shadow:inset 0 0 0 1.5px var(--accent)}
.cal-day.is-sel .num{background:var(--accent);color:var(--accent-fg);font-weight:700}
.cal-legend{display:flex;gap:14px;margin-top:10px;font-size:.75rem;color:var(--muted)}
.cal-legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}

/* 下部の追加ボタン（S） */
.fab-bar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding-top:12px;background:linear-gradient(to top,var(--bg) 60%,transparent)}
#fab{width:100%;height:calc(58px + env(safe-area-inset-bottom,0px));padding:0 max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));border-radius:18px 18px 0 0;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:1.05rem;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;gap:6px}
@media (min-width:600px){.fab-bar{display:none}}

/* シート */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;z-index:21;background:var(--surface);left:0;right:0;bottom:0;border-radius:18px 18px 0 0;max-height:88vh;overflow:auto;padding:6px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:0 -6px 30px rgba(0,0,0,.15)}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 6px}
@media (min-width:600px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(540px,92vw);max-height:86vh;border-radius:18px;padding:8px 22px 22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .sheet::before{display:none}
}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:6px 0 10px}
.sheet-head h2{margin:0;font-size:1.1rem}
.form{display:flex;flex-direction:column;gap:14px}
.form label,.field-label{display:flex;flex-direction:column;gap:6px;font-size:.82rem;font-weight:700;color:var(--muted)}
.form input[type=date],.form input[type=time],.form input:not([type]),.form input[type=text],.form textarea{width:100%;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:1rem;font-weight:400;color:var(--fg)}
.form textarea{resize:vertical;min-height:84px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{margin:-6px 0 0;font-size:.78rem;color:var(--muted)}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cats label{flex-direction:row;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;font-weight:500;color:var(--fg);font-size:.88rem;cursor:pointer}
.cats input{position:absolute;opacity:0;pointer-events:none}
.cats label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.cats label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.photo-field{display:flex;flex-direction:column;gap:8px}
.photo-prev img{width:100%;max-height:240px;object-fit:cover;border-radius:10px;display:block}
.photo-btns{display:flex;gap:8px;flex-wrap:wrap}
.form-actions{display:flex;align-items:center;gap:8px;margin-top:4px}
.spacer{flex:1}
.btn-primary,.btn-ghost,.btn-danger{height:44px;padding:0 18px;border-radius:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--accent);color:var(--accent-fg)}
.btn-ghost{background:var(--surface-2);border:1px solid var(--line)}
.btn-danger{color:var(--danger)}
.btn-danger.armed{background:var(--danger);color:var(--surface)}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{display:flex;align-items:center;gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px;text-align:left}
.choice:hover{background:var(--surface-2)}
.choice small{display:block;color:var(--muted);font-size:.75rem}
.choice .ico{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none}
.choice.event .ico{background:var(--accent-soft);color:var(--accent)}
.choice.read .ico{background:var(--read-soft);color:var(--read)}
.choice.watch .ico{background:var(--watch-soft);color:var(--watch)}
.choice.done .ico{background:var(--done-soft);color:var(--done)}
.choice.thought .ico{background:var(--thought-soft);color:var(--thought)}
.choice.wide{grid-column:1/-1}
.group-label{margin:14px 0 6px;font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.06em}
.ev-detail{padding:4px 0 14px}
.ev-detail .big{font-size:1.15rem;font-weight:700;margin:0}
.ev-detail p{margin:4px 0 0;color:var(--muted);white-space:pre-wrap}
.stack{display:flex;flex-direction:column;gap:8px}
.viewer{width:100%;border-radius:10px;display:block}
.data-sec{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.data-sec:first-child{border-top:0;margin-top:0;padding-top:0}
.data-sec h3{margin:0 0 4px;font-size:.95rem}
.form label.check{flex-direction:row;align-items:center;gap:10px;color:var(--fg);font-weight:500;font-size:.9rem;cursor:pointer}
.form label.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.sp-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:2px}
.tdy{font-size:.68rem;font-weight:700;letter-spacing:.05em;line-height:1.15;color:var(--accent)}
.wk-day.is-sel .tdy{color:var(--accent-fg)}
.cal-day .tdy{font-size:.62rem;margin-top:-2px}
.bg-layer{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg-img{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat;background-position:var(--bx,50%) var(--by,50%);transform-origin:var(--bx,50%) var(--by,50%);transform:scale(var(--bz,1))}
.bg-layer::after,.bg-prev-veil{content:"";position:absolute;inset:0;background:var(--bg);opacity:var(--veil,.4)}
html.has-bgimg .topbar{background:transparent;position:relative;top:auto}
html.has-bgimg body::before{background:transparent}
html.has-bgimg .fab-bar{background:none}
.bg-prev-wrap{display:flex;justify-content:center;margin-bottom:10px}
.bg-zb{position:absolute;right:8px;bottom:8px;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.55);color:#ffffff;pointer-events:none}
.bg-howto{margin:-2px 0 12px;text-align:center}
.bg-prev{position:relative;overflow:hidden;height:300px;aspect-ratio:9/16;max-width:100%;border-radius:10px;background:var(--photo);border:1px solid var(--line);touch-action:none;cursor:grab;user-select:none}
.bg-prev:active{cursor:grabbing}
.bg-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:.82rem}
.veil-l{min-width:4.6em}
/* スマホ：スケジュール↔記録の切り替え */
.pager{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.pager button{flex:1;padding:8px 0;border-radius:9px;font-weight:700;font-size:.9rem;color:var(--muted)}
.pager button.is-on{background:var(--accent-soft);color:var(--accent)}
.pg-dots{display:none;justify-content:center;margin:0}
@media (max-width:599px){html:not([data-page="rem"]) .pg-dots{display:flex}}
.bottom-ui{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 45%,transparent);pointer-events:none}

html.has-bgimg .bottom-ui{background:none}
.navbar{display:flex;gap:6px;padding:5px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 18px rgba(20,30,25,.10)}

.nav-b.is-on{background:var(--accent-soft);color:var(--accent)}
.nav-add{width:92px;height:46px;border-radius:999px;display:grid;place-items:center;background:var(--accent);color:var(--accent-fg)}

/* ページ切り替え：一日のページ / ToDo */
html[data-page="rem"] .week,html[data-page="rem"] #notice,html[data-page="rem"] .layout{display:none!important}
#remPage{display:none;max-width:720px;margin:0 auto}
html[data-page="rem"] #remPage{display:block}
.rem-sec h2{font-size:1.02rem;font-weight:700;margin:20px 4px 8px}
.rem-sec:first-child h2,.notice+.rem-sec h2{margin-top:4px}
.rem-list{display:flex;flex-direction:column;gap:8px}
.rem{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding-left:12px}
.rem-check{width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.rem-check .ic{width:16px;height:16px;stroke-width:2.6}
.rem-check:hover{border-color:var(--accent)}
.rem.is-done .rem-check,.rem.checking .rem-check{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.rem-body{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:14px 12px;text-align:left;color:var(--fg)}
.rem-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rem-txt b{font-weight:700;font-size:1rem;overflow-wrap:anywhere}
.rem-txt small{color:var(--muted);font-size:.84rem;font-variant-numeric:tabular-nums}
.rem-txt small.late{color:var(--danger)}
.rem.is-done .rem-txt b,.rem.checking .rem-txt b{text-decoration:line-through;color:var(--muted)}
.rem-body>.ic{color:var(--muted)}
.rem-done-toggle{width:100%;display:flex;align-items:center;gap:8px;padding:14px 4px;margin-top:20px;border-top:1px solid var(--line);font-weight:700;color:var(--muted)}
.rem-done-toggle span{margin-left:auto;font-weight:500}
.rem-done-toggle .ic{transition:transform .2s}
.rem-done-toggle[aria-expanded="true"] .ic{transform:rotate(90deg)}
.rem-done-toggle+.rem-list{margin-bottom:8px}
.rem-check{border-color:var(--cc,var(--muted))}
.rem-txt small.todo-sch{display:flex;align-items:center;gap:4px;color:var(--accent);font-weight:700}
.rem-txt small.todo-sch.past{color:var(--muted);font-weight:500}
.todo-sch .ic{width:14px;height:14px}
.todo-evs{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.todo-evs button{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;text-align:left;font-weight:700;color:var(--fg)}
.todo-evs button+button{border-top:1px solid var(--line)}
.todo-evs button:hover{background:var(--surface-2)}
.todo-evs .ic{color:var(--muted)}
.num-row{display:flex;align-items:center;gap:8px;color:var(--fg);font-weight:500}
.num-row input{width:6.5em;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:1rem;color:var(--fg);font-variant-numeric:tabular-nums}
.num-tag{font-size:.76rem;font-weight:700;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 7px;white-space:nowrap}
/* 設定ページ */
#setPage{display:none}
html[data-page="set"] #setPage{display:block}
html[data-page="set"] .topbar,html[data-page="set"] .week,html[data-page="set"] #notice,html[data-page="set"] .layout,html[data-page="set"] #remPage,html[data-page="set"] .bottom-ui{display:none!important}
.set-card{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;min-height:calc(100vh - 28px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.set-head{display:flex;align-items:center;gap:4px;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.set-head h1{margin:0;font-size:1.45rem;font-weight:700}

.set-nav{padding:14px 14px 18px}
.set-body{padding:16px 16px 24px}
.set-g{margin:18px 4px 8px;font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.04em}
.set-nav .set-g:first-child{margin-top:4px}
.set-list{display:flex;flex-direction:column;gap:8px}
.set-item{width:100%;display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-weight:700;color:var(--fg);text-align:left}
.set-item>.ic:first-child{width:20px;height:20px;color:var(--accent)}
.set-item>span{flex:1;min-width:0}
.set-item>.ic:last-child{color:var(--muted)}
.set-item:hover{border-color:var(--muted)}
.set-item.is-on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.set-wrap[data-sub="1"] .set-nav{display:none}
.set-wrap:not([data-sub="1"]) .set-body{display:none}
.set-h{display:none;margin:0 0 14px;font-size:1.2rem;font-weight:700}
.set-note{margin:0 0 14px;font-size:.86rem;color:var(--muted)}
.set-body .data-sec{border:0;padding:0;margin:0}
.set-body .data-sec h3{display:none}
.set-ta{width:100%;min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:.75rem;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--fg)}
.th-list{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.th-row{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;color:var(--fg);font-size:.98rem;min-width:0}
.th-row:hover{border-color:var(--muted)}
.th-row.is-on{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.th-name{flex:1;min-width:0}
.th-name small{display:block;font-size:.74rem;font-weight:500;color:var(--muted)}
.th-row .ck{color:var(--accent);visibility:hidden}
.th-row.is-on .ck{visibility:visible}
.th-tile{width:44px;height:32px;border-radius:8px;border:1px solid rgba(128,128,128,.35);display:grid;place-items:center;flex:none}
.th-tile i{width:18px;height:3px;border-radius:2px}
@media (min-width:600px){
  .set-card{min-height:520px;margin-bottom:24px}
  .set-head{padding:12px 16px}
  .set-wrap{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:470px}
  .set-wrap .set-nav,.set-wrap .set-body{display:block!important}
  .set-nav{padding:14px 12px;border-right:1px solid var(--line)}
  .set-body{padding:20px 24px 28px;min-width:0}
  .set-item{padding:10px 12px;border-radius:10px}
  .set-h{display:block}
  .th-list{grid-template-columns:repeat(2,minmax(0,1fr))}
}
html.has-bgimg .set-card,html.has-bgimg .set-item,html.has-bgimg .th-row:not(.is-on){background:color-mix(in srgb,var(--surface) var(--panel-a,100%),transparent)}
.strip i.fr{background:var(--accent);opacity:.16;border:0;min-width:0}
.tl-free{position:absolute;left:6px;right:4px;border:1px dashed color-mix(in srgb,var(--accent) 45%,transparent);border-radius:8px;background:color-mix(in srgb,var(--accent) 6%,transparent);display:flex;align-items:flex-start;justify-content:center;padding-top:5px;overflow:hidden;pointer-events:none}
.tl-free span{font-size:.74rem;font-weight:700;color:var(--accent)}
.tl-b.cont{opacity:.8}
.ttl .cont{display:inline-block;font-size:.68rem;font-weight:700;color:var(--muted);margin-right:6px;border:1px solid var(--line);border-radius:5px;padding:0 5px;vertical-align:1px}
.tp-lbl-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.seg.seg-sm{flex:none}
.seg-sm .seg-b{padding:5px 14px;font-size:.82rem}
.awake{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.84rem;font-weight:700;color:var(--muted)}
.awake select{flex:1;min-width:5.5em;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:1rem;color:var(--fg);font-variant-numeric:tabular-nums}
.ev-detail p.big{color:var(--fg)}
.rem-sec h2{display:flex;align-items:center;gap:8px}
.rem-sec h2 span{font-size:.8rem;color:var(--muted);font-weight:500}
.cdot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.tf-row{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px 4px;scrollbar-width:none}
.tf-row::-webkit-scrollbar{display:none}
.tf{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.86rem;color:var(--fg);white-space:nowrap}
.tf span{font-weight:500;color:var(--muted);font-size:.78rem}
.tf.is-on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tf.is-on span{color:var(--accent-fg);opacity:.8}
.tf-edit{padding:0 10px;color:var(--muted)}
.tf-row+.rem-sec h2,.tf-row+.rem-list{margin-top:6px}
.newcat{display:flex;gap:8px;margin-top:8px}
.newcat input,.cm-name{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:1rem;font-weight:400;color:var(--fg)}
.newcat .btn-ghost{color:var(--fg);flex:none}
.cm-row{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:10px}
.cm-top{display:flex;align-items:center;gap:2px}
.cm-del{height:40px;padding:0 10px;flex:none}
.icon-btn:disabled{opacity:.3;cursor:default}
.cm-colors{display:flex;gap:10px;padding-left:2px}
.sw-b{width:26px;height:26px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 2px var(--surface)}
.sw-b.is-on{border-color:var(--fg)}
html.has-bgimg .tf:not(.is-on){background:color-mix(in srgb,var(--surface) var(--panel-a,100%),transparent)}
.pg-dots button{width:14px;height:22px;display:grid;place-items:center}
.pg-dots button::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--muted);opacity:.4;transition:opacity .2s,background .2s}
.pg-dots button.is-on::after{background:var(--fg);opacity:.9}
@media (max-width:599px){
  .layout[data-show="sched"] [data-pane-id="rec"],.layout[data-show="rec"] [data-pane-id="sched"]{display:none}
  .layout .pane{min-height:55vh}
}
@media (prefers-reduced-motion:no-preference){.pane.slide-l{animation:slL .22s ease-out}.pane.slide-r{animation:slR .22s ease-out}}
@keyframes slL{from{transform:translateX(28px);opacity:.3}}
@keyframes slR{from{transform:translateX(-28px);opacity:.3}}
/* スケジュールの見せ方：スマホ=帯＋一覧、タブレット・PC=タイムライン */
.sv-t{display:none}
@media (min-width:600px){.sv-s{display:none}.sv-t{display:block}}
.sum{font-size:.82rem;color:var(--muted);margin:0 0 8px}
.sum b{color:var(--fg);font-weight:700;font-variant-numeric:tabular-nums}
.strip{position:relative;height:20px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.strip i{position:absolute;top:0;bottom:0;background:var(--accent);opacity:.85;border-left:1px solid var(--surface);min-width:3px}
.strip i.now{background:var(--watch);opacity:1;width:2px;min-width:2px;border:0}
.ticks{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);margin:3px 0 6px}
.sv-s .sched button{grid-template-columns:56px minmax(0,1fr) auto}
.sched .dur{font-size:.78rem;color:var(--muted);font-weight:500;white-space:nowrap;padding-left:8px}
.allday-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.allday-b{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-weight:700;font-size:.88rem;color:var(--fg)}
.allday-b .t{font-size:.72rem;color:var(--read)}
.tl{position:relative;margin:10px 0 6px 46px}
.tl-h{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.tl-h span{position:absolute;right:calc(100% + 8px);top:-.7em;font-size:.72rem;color:var(--muted);white-space:nowrap}
.tl-b{position:absolute;display:flex;flex-direction:column;gap:1px;padding:5px 9px;border-radius:8px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);color:var(--fg);text-align:left;overflow:hidden;font-size:.82rem;line-height:1.35}
.tl-b:hover{border-color:var(--accent)}
.tl-b b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-b small{color:var(--muted);font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-b.short{flex-direction:row;align-items:center;gap:8px;padding-block:2px}
.tl-b.noend{border-style:dashed}
.tl-now{position:absolute;left:-4px;right:0;height:2px;background:var(--watch);pointer-events:none}
.tl-now::before{content:"";position:absolute;left:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--watch)}
.sched .t-end{display:block;font-size:.75rem;line-height:1.3}
.tp-sec{display:flex;flex-direction:column;gap:6px}
.tp-lbl{font-size:.82rem;font-weight:700;color:var(--muted)}
.tp{display:flex;flex-direction:column;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px}
.tp-blocks{display:flex;align-items:center;gap:8px}
.tp-b{flex:1;display:flex;align-items:baseline;justify-content:center;gap:4px;padding:10px 0;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--fg)}

.tp-b small{font-size:.8rem;font-weight:700;color:var(--muted)}
.tp-b.is-open{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tp-colon{font-size:1.4rem;font-weight:700;color:var(--muted)}
.tp-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.tp-o{padding:10px 0;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-weight:700;color:var(--fg)}
.tp-o:hover{border-color:var(--accent)}
.tp-o.is-on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.field-label .seg{font-size:.92rem}
html.has-bgimg .pane,html.has-bgimg .week,html.has-bgimg .rem,html.has-bgimg .navbar,html.has-bgimg .card,html.has-bgimg .notice{background:color-mix(in srgb,var(--surface) var(--panel-a,100%),transparent)}
.seg-row{display:flex;align-items:center;gap:12px;margin-top:14px;font-size:.84rem;color:var(--muted);font-weight:700}
.seg{display:flex;flex:1;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg-b{flex:1;padding:8px 0;font-weight:700;color:var(--fg)}
.seg-b+.seg-b{border-left:1px solid var(--line)}
.seg-b.is-on{background:var(--accent);color:var(--accent-fg)}
html.has-bgimg[data-hd="white"] .topbar{color:#ffffff;text-shadow:0 1px 3px rgba(0,0,0,.45)}
html.has-bgimg[data-hd="black"] .topbar{color:#111614;text-shadow:0 1px 3px rgba(255,255,255,.55)}
html.has-bgimg[data-hd] .topbar .dow,html.has-bgimg[data-hd] .topbar .icon-btn{color:inherit}
html.has-bgimg[data-hd="white"] .topbar .ic{filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
.veil{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:.84rem;color:var(--muted);font-weight:700}
.veil input{flex:1;accent-color:var(--accent)}
.veil output{min-width:3em;text-align:right;font-variant-numeric:tabular-nums}
.data-sec p{margin:0 0 10px;font-size:.84rem;color:var(--muted)}
.data-sec textarea{width:100%;min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:.75rem;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.theme-opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;text-align:left;min-width:0}
.theme-opt:hover{background:var(--surface-2)}
.theme-opt.is-on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.theme-opt b{display:block;font-size:.9rem}
.theme-opt small{display:block;font-size:.72rem;color:var(--muted);line-height:1.4}
.sw{display:flex;flex:none}
.sw i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(128,128,128,.35)}
.sw i+i{margin-left:-6px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.85rem;font-weight:700;z-index:30;white-space:nowrap}

@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .2s ease-out}
  @media (min-width:600px){.sheet{animation:pop .16s ease-out}}
}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
@keyframes pop{from{transform:translate(-50%,-48%);opacity:.6}}
</style>

<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="hd-date">
      <h1 id="hdDate" class="num">11月24日</h1>
      <span id="hdDow" class="dow">火</span>
    </div>
    <div class="hd-actions">
      <button class="icon-btn only-sm" id="openMonth" type="button" aria-label="月間カレンダー"></button>
      <button class="icon-btn" id="openData" type="button" aria-label="設定"></button>
    </div>
  </header>

  <nav class="week" id="week" aria-label="週"></nav>
  <div id="notice"></div>

  <main class="layout" data-show="sched">
    <aside class="pane cal-pane" id="calPane" aria-label="月カレンダー"></aside>
    <section class="pane" data-pane-id="sched" aria-labelledby="schedH">
      <div class="pane-head"><h2 id="schedH">スケジュール</h2><button class="pane-add" type="button" data-add="event"></button></div>
      <div id="sched"></div>
    </section>
    <section class="pane" data-pane-id="rec" aria-labelledby="recH">
      <div class="pane-head"><h2 id="recH">今日の記録</h2><button class="pane-add" type="button" data-add="entry"></button></div>
      <div id="records"></div>
    </section>
  </main>
  <section id="remPage" aria-label="ToDoリスト"><div id="remList"></div></section>
  <section id="setPage" aria-labelledby="setTitle">
    <div class="set-card"><div class="set-head"><button type="button" class="icon-btn" id="setBack" aria-label="戻る"></button><h1 id="setTitle">設定</h1></div>
    <div class="set-wrap" id="setWrap"><nav class="set-nav" id="setNav" aria-label="設定の項目"></nav><div class="set-body" id="setBody"></div></div></div>
  </section>
</div>

<div class="bg-layer" id="bgLayer" hidden><div class="bg-img" id="bgImg"></div></div>
<div class="bottom-ui"><div class="pg-dots" role="tablist" aria-label="スケジュールと記録の切り替え"><button type="button" role="tab" class="is-on" aria-selected="true" aria-label="スケジュール" data-pane="sched"></button><button type="button" role="tab" aria-selected="false" aria-label="記録" data-pane="rec"></button></div><nav class="navbar" aria-label="ページ"><button type="button" class="nav-b is-on" id="navDay" aria-label="一日のページ"></button><button type="button" class="nav-add" id="navAdd" aria-label="追加"></button><button type="button" class="nav-b" id="navRem" aria-label="ToDoリスト"></button></nav></div>
<div class="scrim" id="scrim" hidden data-close></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const nowIso=()=>new Date().toISOString();
const uid=()=>{try{if(crypto.randomUUID)return crypto.randomUUID()}catch(e){}return 'id-'+Date.now().toString(36)+Math.random().toString(36).slice(2,10)};
const DOW=['日','月','火','水','木','金','土'];

const ICONS={
  manga:'<path d="M4 5h16v11H9l-4 3v-3H4z"/><path d="M8 9h8M8 12h5"/>',
  novel:'<path d="M3 6c3-1 6-1 9 1 3-2 6-2 9-1v12c-3-1-6-1-9 1-3-2-6-2-9-1z"/><path d="M12 7v12"/>',
  shinsho:'<rect x="6" y="3" width="12" height="18" rx="1.5"/><path d="M10 3v18M13 8h3M13 11h3"/>',
  magazine:'<rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M8 8h8M8 12h3M8 16h3M14 12h2v4h-2z"/>',
  movie:'<rect x="4" y="10" width="16" height="10" rx="1.5"/><path d="M4 10l15-4 1 3.5M8.5 8.8l1.8-3.2M13.5 7.5l1.8-3.2"/>',
  drama:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 3l4 4 4-4M12 11v5M9.5 13.5h5"/>',
  anime:'<path d="M2.5 13s3.8-5.5 9.5-5.5S21.5 13 21.5 13 17.7 18.5 12 18.5 2.5 13 2.5 13z"/><circle cx="12" cy="13" r="2.8"/><path d="M12 3v2M5.5 5l1.4 1.4M18.5 5l-1.4 1.4"/>',
  net:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/>',
  photo:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  grid:'<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>',
  upload:'<path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M4 14v5a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/>',
  download:'<path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M4 14v5a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/>',
  chevU:'<path d="M6 15l6-6 6 6"/>', chevD:'<path d="M6 9l6 6 6-6"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
  checklist:'<rect x="4" y="3.5" width="16" height="17" rx="2"/><path d="M8 9l1.4 1.4L12 8M8 15l1.4 1.4L12 14M14.5 9.5H17M14.5 15.5H17"/>',
  cal:'<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4M8 13.5h.01M12 13.5h.01M16 13.5h.01M8 17h.01M12 17h.01"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/>',
  chevL:'<path d="M15 6l-6 6 6 6"/>', chevR:'<path d="M9 6l6 6-6 6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', close:'<path d="M6 6l12 12M18 6L6 18"/>',
  more:'<circle cx="5.5" cy="12" r=".9"/><circle cx="12" cy="12" r=".9"/><circle cx="18.5" cy="12" r=".9"/>'
};
const icon=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||''}</svg>`;

const CATS=[
  {id:'cat-manga',group:'read',name:'漫画',icon:'manga',unit:'巻',numLabel:'巻数'},
  {id:'cat-novel',group:'read',name:'小説',icon:'novel'},
  {id:'cat-shinsho',group:'read',name:'新書',icon:'shinsho'},
  {id:'cat-magazine',group:'read',name:'雑誌',icon:'magazine'},
  {id:'cat-movie',group:'watched',name:'映画',icon:'movie'},
  {id:'cat-drama',group:'watched',name:'ドラマ',icon:'drama',unit:'話',numLabel:'話数'},
  {id:'cat-anime',group:'watched',name:'アニメ',icon:'anime',unit:'話',numLabel:'話数'},
  {id:'cat-net',group:'watched',name:'ネット動画',icon:'net',unit:'パート',numLabel:'パート数'}
];
const catById=id=>CATS.find(c=>c.id===id);
const KINDS={
  read:{label:'読んだ',icon:'novel',cls:'read',sub:'漫画・小説・新書・雑誌'},
  watched:{label:'観た',icon:'movie',cls:'watch',sub:'映画・ドラマ・アニメ・動画'},
  done:{label:'やれたこと',icon:'check',cls:'done',sub:'できたことを一行で'},
  thought:{label:'思ったこと',icon:'bulb',cls:'thought',sub:'感じたことを一行で'}
};
const isMedia=k=>k==='read'||k==='watched';

/* ---------- 保存（IndexedDB） ---------- */
const STORES=['events','entries','photos','meta','reminders'];
let idb=null;
function openDB(){return new Promise(res=>{try{
  const r=indexedDB.open('schedule-diary',2);
  r.onupgradeneeded=()=>{const d=r.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})})};
  r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); r.onblocked=()=>res(null);
}catch(e){res(null)}})}
function getAll(s){return new Promise(res=>{if(!idb)return res([]);try{const q=idb.transaction(s).objectStore(s).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])}catch(e){res([])}})}
function put(s,o){if(!idb)return;try{idb.transaction(s,'readwrite').objectStore(s).put(o)}catch(e){}}
function hardDel(s,id){if(!idb)return;try{idb.transaction(s,'readwrite').objectStore(s).delete(id)}catch(e){}}
function clearStore(s){return new Promise(res=>{if(!idb)return res();try{const q=idb.transaction(s,'readwrite').objectStore(s).clear();q.onsuccess=()=>res();q.onerror=()=>res()}catch(e){res()}})}

const state={date:today(),view:null,events:[],entries:[],reminders:[],photos:new Map(),meta:{},page:'day',showDone:false,todoFilter:'all'};
function setView(d){const x=parse(d);state.view={y:x.getFullYear(),m:x.getMonth()}}
function setMeta(k,v){state.meta[k]=v;put('meta',{id:k,value:v})}
const alive=x=>!x.deletedAt;
const eventsOn=d=>state.events.filter(e=>alive(e)&&e.date===d).sort((a,b)=>(a.time||'')<(b.time||'')?-1:(a.time||'')>(b.time||'')?1:0);
const entriesOn=d=>state.entries.filter(e=>alive(e)&&e.date===d).sort((a,b)=>a.order-b.order);
function marks(){const ev=new Set(),en=new Set();state.events.forEach(e=>alive(e)&&e.special&&ev.add(e.date));return{ev,en}}

function upsert(list,store,o){o.updatedAt=nowIso();if(!o.createdAt)o.createdAt=o.updatedAt;const i=list.findIndex(x=>x.id===o.id);if(i>=0)list[i]=o;else list.push(o);put(store,o)}
function softDelete(list,store,id){const o=list.find(x=>x.id===id);if(!o)return;o.deletedAt=nowIso();o.updatedAt=o.deletedAt;put(store,o);if(store==='entries'&&o.photoId){state.photos.delete(o.photoId);hardDel('photos',o.photoId)}}

function seedSamples(){
  const t=today(),S=true;
  const ev=(date,time,title,special=false)=>upsert(state.events,'events',{id:uid(),date,time,title,memo:'',special,sample:S});
  const en=(date,kind,categoryId,title,body,o)=>upsert(state.entries,'entries',{id:uid(),date,kind,categoryId,title,body,photoId:null,fromEventId:null,order:o,sample:S});
  ev(t,'12:30','昼休みに読書');ev(t,'19:00','買い物');ev(t,'20:00','映画を観る');ev(t,'22:00','明日の準備');
  en(t,'read','cat-novel','短編集を1話','最後の一文がよかった。',1);
  en(t,'watched','cat-movie','映画を1本','帰り道の場面が印象に残った。',2);
  en(t,'done',null,'','机の上を片づけた。',3);
  en(t,'thought',null,'','夜に少し余裕があると、本を開きやすい。',4);
  en(addDays(t,-2),'read','cat-manga','続きものの最新巻','次の巻が待ち遠しい。',1);
  en(addDays(t,-5),'done',null,'','朝のうちに洗濯を終えた。',1);
  ev(addDays(t,3),'','友人と出かける',true);ev(addDays(t,1),'09:00','通院');
}
const hasSamples=()=>state.events.some(e=>alive(e)&&e.sample)||state.entries.some(e=>alive(e)&&e.sample);
function clearSamples(){
  state.events.filter(e=>e.sample&&alive(e)).forEach(e=>softDelete(state.events,'events',e.id));
  state.entries.filter(e=>e.sample&&alive(e)).forEach(e=>softDelete(state.entries,'entries',e.id));
  state.reminders.filter(e=>e.sample&&alive(e)).forEach(e=>softDelete(state.reminders,'reminders',e.id));
  render();toast('サンプルを消しました');
}

/* ---------- 描画 ---------- */
function render(){renderHeader();renderWeek();renderNotice();renderMonthAll();renderSchedule();renderRecords();renderReminders()}

function renderHeader(){
  const d=parse(state.date),isT=state.date===today();
  const rem=state.page==='rem';$('#openMonth').hidden=rem;
  $('#hdDate').textContent=rem?'ToDo':`${d.getMonth()+1}月${d.getDate()}日`;
  $('#hdDow').textContent=rem?'':DOW[d.getDay()];
  $('#recH').textContent=isT?'今日の記録':`${d.getMonth()+1}/${d.getDate()}の記録`;
  const last=state.meta.lastExport,real=state.entries.some(e=>alive(e)&&!e.sample)||state.events.some(e=>alive(e)&&!e.sample);
  const stale=!last||(Date.now()-new Date(last).getTime())>14*864e5;
  $('#openData').classList.toggle('has-alert',real&&stale);
}

function renderWeek(){
  const d=parse(state.date),start=addDays(state.date,-d.getDay()),{ev,en}=marks();let h='';
  for(let i=0;i<7;i++){const s=addDays(start,i),x=parse(s);
    h+=`<button type="button" class="wk-day${s===state.date?' is-sel':''}" data-date="${s}" aria-label="${x.getMonth()+1}月${x.getDate()}日"><small>${DOW[x.getDay()]}</small><b class="num">${x.getDate()}</b>${s===today()?'<span class="tdy">today</span>':''}<span class="dots">${ev.has(s)?'<i class="dot ev"></i>':''}${en.has(s)?'<i class="dot en"></i>':''}</span></button>`}
  $('#week').innerHTML=h;
}

function renderNotice(){
  let h='';
  if(!idb)h+=`<div class="notice"><span>この環境ではデータを端末に保存できません。閉じると内容は消えます。</span></div>`;
  if(hasSamples())h+=`<div class="notice"><span>サンプルの予定と記録を表示しています。</span><button type="button" data-clear-samples>サンプルを消す</button></div>`;
  $('#notice').innerHTML=h;
}

function monthHTML(){
  const {y,m}=state.view,first=new Date(y,m,1),lead=first.getDay(),days=new Date(y,m+1,0).getDate(),{ev,en}=marks(),t=today();
  let h=`<div class="cal-head"><h2 class="num">${y}年${m+1}月</h2><div><button class="icon-btn" type="button" data-mnav="-1" aria-label="前の月">${icon('chevL')}</button><button class="icon-btn" type="button" data-mnav="1" aria-label="次の月">${icon('chevR')}</button></div></div><div class="cal-grid">`;
  ['日','月','火','水','木','金','土'].forEach(w=>h+=`<div class="cal-dow">${w}</div>`);
  for(let i=0;i<lead;i++)h+='<div></div>';
  for(let dd=1;dd<=days;dd++){const s=`${y}-${pad(m+1)}-${pad(dd)}`;
    h+=`<button type="button" class="cal-day${s===state.date?' is-sel':''}${s===t?' is-today':''}" data-date="${s}" aria-label="${m+1}月${dd}日"><span class="num">${dd}</span>${s===t?'<span class="tdy">today</span>':''}<span class="dots">${ev.has(s)?'<i class="dot ev"></i>':''}${en.has(s)?'<i class="dot en"></i>':''}</span></button>`}
  return h+`</div><div class="cal-legend"><span><i style="background:var(--accent)"></i>特別な予定</span></div>`;
}
function renderMonthAll(){$('#calPane').innerHTML=monthHTML();const sc=$('#sheetCal');if(sc)sc.innerHTML=monthHTML()}

const endLabel=e=>e.endTime?(e.endNext?(e.endTime==='00:00'?'24:00':'翌'+e.endTime):e.endTime):'';
const evDur=e=>{if(!e.time||!e.endTime)return 0;let d=toMin(e.endTime)-toMin(e.time);if(e.endNext)d+=1440;return Math.max(0,d)};
const fmtDur=m=>m<60?`${m}分`:`${Math.floor(m/60)}時間${m%60?pad(m%60)+'分':''}`;
function daySegs(date){
  const prev=addDays(date,-1),out=[];
  state.events.forEach(e=>{if(!alive(e)||!e.time)return;
    if(e.date===date){const s=toMin(e.time);let en=e.endTime?(e.endNext?1440:toMin(e.endTime)):s+30;if(en<=s)en=s+30;out.push({e,s,en:Math.min(en,1440),noend:!e.endTime,cont:false})}
    else if(e.date===prev&&e.endNext&&e.endTime&&e.endTime!=='00:00')out.push({e,s:0,en:toMin(e.endTime),noend:false,cont:true})});
  return out.sort((a,b)=>a.s-b.s||b.en-a.en);
}
function unionSegs(segs){const r=[];segs.map(x=>[x.s,x.en]).sort((a,b)=>a[0]-b[0]).forEach(([s,e])=>{const l=r[r.length-1];if(l&&s<=l[1])l[1]=Math.max(l[1],e);else r.push([s,e])});return r}
function awake(){const s=state.meta.awakeS??420,e=state.meta.awakeE??1380;return e>s?[s,e]:[420,1380]}
function freeGaps(segs){
  const [A,B]=awake(),g=[];let c=A;
  unionSegs(segs).forEach(([s,e])=>{if(e<=A||s>=B)return;s=Math.max(s,A);e=Math.min(e,B);if(s-c>=15)g.push([c,s]);c=Math.max(c,e)});
  if(B-c>=15)g.push([c,B]);return g;
}
function renderSchedule(){
  const list=eventsOn(state.date),linked=new Set(state.entries.filter(alive).map(e=>e.fromEventId).filter(Boolean));
  const segs=daySegs(state.date),carry=segs.filter(x=>x.cont);
  const busy=unionSegs(segs).reduce((a,[s,e])=>a+(e-s),0);
  const gaps=freeGaps(segs),free=gaps.reduce((a,[s,e])=>a+(e-s),0);
  const isT=state.date===today(),nowM=(()=>{const d=new Date();return d.getHours()*60+d.getMinutes()})();
  const title=e=>`${e.special?'<i class="sp-dot" title="特別な予定"></i>':''}${esc(e.title)}${linked.has(e.id)?'<span class="linked">記録済み</span>':''}`;
  const sum=`<p class="sum">${busy?`予定 <b>${fmtDur(busy)}</b>　`:''}自由時間 <b>${fmtDur(free)}</b></p>`;
  if(!list.length&&!carry.length){$('#sched').innerHTML=`${sum}<p class="empty">予定はありません。</p>`;return}
  const P=m=>m/14.4;

  /* スマホ：一日の帯＋一覧 */
  const strip=`<div class="strip" aria-hidden="true">${gaps.map(([s,e])=>`<i class="fr" style="left:${P(s)}%;width:${P(e-s)}%"></i>`).join('')}${segs.map(x=>`<i style="left:${P(x.s)}%;width:${P(Math.max(x.en-x.s,15))}%"></i>`).join('')}${isT?`<i class="now" style="left:${P(nowM)}%"></i>`:''}</div><div class="ticks num"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div>`;
  const row=(e,cont)=>{const d=cont?toMin(e.endTime):evDur(e);
    return `<li><button type="button" data-event="${e.id}"><span class="t num${e.time?'':' allday'}">${cont?'00:00':(e.time||'終日')}${e.time&&e.endTime?`<small class="t-end">〜${cont?e.endTime:endLabel(e)}</small>`:''}</span><span class="ttl">${cont?'<span class="cont">前日から</span>':''}${title(e)}${e.memo&&!cont?`<span class="memo">${esc(e.memo)}</span>`:''}</span><span class="dur num">${d>0?fmtDur(d):''}</span></button></li>`};
  const allday=list.filter(e=>!e.time);
  const sview=`<div class="sv-s">${sum}${strip}<ul class="sched">${allday.map(e=>row(e,false)).join('')}${carry.map(x=>row(x.e,true)).join('')}${list.filter(e=>e.time).map(e=>row(e,false)).join('')}</ul></div>`;

  /* タブレット・PC：時間軸タイムライン（空き時間は自由時間として表示） */
  const PX=44,[A,B]=awake();
  const items=segs.map(x=>({...x}));
  const groups=[];let cur=[],curEnd=-1;
  items.forEach(it=>{if(cur.length&&it.s>=curEnd){groups.push(cur);cur=[];curEnd=-1}cur.push(it);curEnd=Math.max(curEnd,it.en)});if(cur.length)groups.push(cur);
  groups.forEach(g=>{const cols=[];g.forEach(it=>{let c=cols.findIndex(x=>x<=it.s);if(c<0){c=cols.length;cols.push(0)}cols[c]=it.en;it.col=c});g.forEach(it=>it.n=cols.length)});
  let sH=Math.floor(Math.min(A,...items.map(i=>i.s))/60),eH=Math.ceil(Math.max(B,...items.map(i=>i.en))/60);
  if(isT){sH=Math.min(sH,Math.floor(nowM/60));eH=Math.max(eH,Math.ceil((nowM+1)/60))}
  sH=Math.max(0,sH);eH=Math.min(24,eH);
  let h='';for(let i=sH;i<=eH;i++)h+=`<div class="tl-h" style="top:${(i-sH)*PX}px"><span class="num">${i}:00</span></div>`;
  h+=gaps.map(([s,e])=>{const ht=(e-s)/60*PX-3;return `<div class="tl-free" style="top:${(s-sH*60)/60*PX+1}px;height:${ht}px">${ht>=18?`<span class="num">自由時間 ${fmtDur(e-s)}</span>`:''}</div>`}).join('');
  h+=items.map(it=>{const top=(it.s-sH*60)/60*PX,ht=Math.max(22,(it.en-it.s)/60*PX-3),short=ht<40,e=it.e;
    const tm=it.cont?`00:00〜${e.endTime}`:`${e.time}${e.endTime?'〜'+endLabel(e):''}`,d=it.cont?it.en-it.s:evDur(e);
    return `<button type="button" class="tl-b${it.noend?' noend':''}${it.cont?' cont':''}${short?' short':''}" data-event="${e.id}" style="top:${top+1}px;height:${ht}px;left:calc(${it.col/it.n*100}% + 6px);width:calc(${100/it.n}% - 10px)"><b>${it.cont?'（前日から）':''}${title(e)}</b><small class="num">${tm}${d>0?'　'+fmtDur(d):''}</small></button>`}).join('');
  if(isT&&nowM>=sH*60&&nowM<=eH*60)h+=`<div class="tl-now" style="top:${(nowM-sH*60)/60*PX}px" aria-hidden="true"></div>`;
  const tview=items.length||gaps.length?`<div class="tl" style="height:${(eH-sH)*PX}px">${h}</div>`:'';
  const ad=allday.length?`<div class="allday-row">${allday.map(e=>`<button type="button" class="allday-b" data-event="${e.id}"><span class="t allday">終日</span>${title(e)}</button>`).join('')}</div>`:'';
  $('#sched').innerHTML=sview+`<div class="sv-t">${sum}${ad}${tview}</div>`;
}

function renderRecords(){
  const all=entriesOn(state.date),cards=all.filter(e=>isMedia(e.kind)),done=all.filter(e=>e.kind==='done'),th=all.filter(e=>e.kind==='thought');
  if(!all.length){$('#records').innerHTML=`<p class="empty">まだ記録はありません。読んだもの、観たもの、やれたことを残しておけます。</p>`;return}
  let h='';
  if(cards.length)h+=`<div class="records">${cards.map(e=>{const c=catById(e.categoryId)||CATS[0],k=KINDS[e.kind],p=e.photoId&&state.photos.get(e.photoId);
    return `<div class="card" role="button" tabindex="0" data-entry="${e.id}"><div class="card-head"><span class="chip ${k.cls}">${icon(c.icon)}${esc(c.name)}</span><h3>${esc(e.title)}</h3>${numText(e)?`<span class="num-tag num">${numText(e)}</span>`:''}</div>${e.body?`<p>${esc(e.body)}</p>`:''}${p?`<button type="button" class="thumb" data-photo="${p.id}" aria-label="添付写真を拡大"><img src="${p.thumb}" alt="添付写真"></button>`:''}</div>`}).join('')}</div>`;
  const grp=(arr,kind)=>arr.length?`<section class="note-group ${KINDS[kind].cls}"><span class="chip ${KINDS[kind].cls}">${KINDS[kind].label}</span><ul>${arr.map(e=>`<li><button type="button" data-entry="${e.id}">${esc(e.body)}</button></li>`).join('')}</ul></section>`:'';

  $('#records').innerHTML=h;
}

/* ---------- 時刻ピッカー ---------- */
const toMin=v=>{const[h,m]=v.split(':').map(Number);return h*60+m};
const fromMin=n=>{n=Math.max(0,Math.min(1435,n));return `${pad(Math.floor(n/60))}:${pad(n%60)}`};
function nextHour(){const d=new Date();return fromMin((d.getHours()+1)*60)}
function tpHTML(id,val){
  const [h,m]=val.split(':').map(Number),pm=h>=12;
  return `<div class="tp" id="${id}" data-h="${h}" data-m="${m}">
    <div class="seg" role="radiogroup" aria-label="午前・午後"><button type="button" class="seg-b${pm?'':' is-on'}" role="radio" aria-checked="${!pm}" data-ap="am">午前</button><button type="button" class="seg-b${pm?' is-on':''}" role="radio" aria-checked="${pm}" data-ap="pm">午後</button></div>
    <div class="tp-blocks"><button type="button" class="tp-b" data-open="h" aria-label="時を選ぶ"><b class="num" data-v="h">${h%12}</b><small>時</small></button><span class="tp-colon">:</span><button type="button" class="tp-b" data-open="m" aria-label="分を選ぶ"><b class="num" data-v="m">${pad(m)}</b><small>分</small></button></div>
    <div class="tp-grid" data-grid hidden></div></div>`;
}
function tpMount(el){
  const grid=$('[data-grid]',el);let open=null;
  const fire=()=>el.dispatchEvent(new Event('tpchange'));
  const mark=()=>$$('[data-open]',el).forEach(b=>b.classList.toggle('is-open',b.dataset.open===open));
  const show=()=>{const h=+el.dataset.h,m=+el.dataset.m;$('[data-v=h]',el).textContent=h%12;$('[data-v=m]',el).textContent=pad(m);
    $$('[data-ap]',el).forEach(b=>{const on=(b.dataset.ap==='pm')===(h>=12);b.classList.toggle('is-on',on);b.setAttribute('aria-checked',on)})};
  const openGrid=k=>{if(open===k){open=null;grid.hidden=true;mark();return}open=k;const h=+el.dataset.h,m=+el.dataset.m;
    const items=[...Array(12).keys()].map(i=>k==='h'?{v:i,l:String(i),on:h%12===i}:{v:i*5,l:pad(i*5),on:m===i*5});
    grid.innerHTML=items.map(x=>`<button type="button" class="tp-o num${x.on?' is-on':''}" data-pick-v="${x.v}">${x.l}</button>`).join('');grid.hidden=false;mark()};
  el.addEventListener('click',e=>{const t=e.target.closest('[data-ap],[data-open],[data-pick-v]');if(!t)return;
    if(t.dataset.ap){el.dataset.h=(+el.dataset.h%12)+(t.dataset.ap==='pm'?12:0);show();fire();return}
    if(t.dataset.open){openGrid(t.dataset.open);return}
    const v=+t.dataset.pickV;if(open==='h')el.dataset.h=v+(+el.dataset.h>=12?12:0);else el.dataset.m=v;
    open=null;grid.hidden=true;mark();show();fire()});
  return{get:()=>`${pad(+el.dataset.h)}:${pad(+el.dataset.m)}`,set:v=>{const[h,m]=v.split(':').map(Number);el.dataset.h=h;el.dataset.m=m;show()}};
}

function openEventForm(ev,pre){

  openSheet(ev?'予定を編集':'予定を追加',`<form class="form" id="evForm" novalidate>
    <label>日付<input id="f-date" type="date" required value="${e.date}"></label>

  s=>{

    const setMode=m=>{mode=m;$$('[data-mode]',s).forEach(b=>{const on=b.dataset.mode===m;b.classList.toggle('is-on',on);b.setAttribute('aria-checked',on)});$('#f-times',s).hidden=m!=='time'};
    setMode(mode);$$('[data-mode]',s).forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
    let endNext=!!(e.endNext&&e.endTime);
    const setEndDay=v=>{endNext=v==='next';$$('[data-endday]',s).forEach(b=>{const on=b.dataset.endday===v;b.classList.toggle('is-on',on);b.setAttribute('aria-checked',on)})};
    setEndDay(endNext?'next':'same');$$('[data-endday]',s).forEach(b=>b.onclick=()=>setEndDay(b.dataset.endday));
    const bump=()=>{if(endNext)return;const sm=toMin(st.get());if(toMin(en.get())<=sm){const n=sm+60;if(n>=1440){setEndDay('next');en.set(fromMin(n-1440))}else en.set(fromMin(n))}};
    if(!ev)bump();

    $('#evForm',s).onsubmit=x=>{x.preventDefault();const title=$('#f-title',s).value.trim(),date=$('#f-date',s).value;

    const d=$('#f-del',s);if(d)armDelete(d,()=>{softDelete(state.events,'events',e.id);closeSheet();render();toast('予定を削除しました')});
  });
}

function compress(file,max){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
  const draw=max=>{const r=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.85)};
  res({full:draw(max||1600),thumb:draw(480),createdAt:nowIso()})};img.src=fr.result};fr.readAsDataURL(file)})}

/* ---------- 背景画像 ---------- */
const BGD={bgVeil:40,bgZoom:100,bgX:50,bgY:50,bgPanel:0};
function hexLum(h){if(!/^#[0-9a-f]{6}$/i.test(h))return null;const n=parseInt(h.slice(1),16);return (.2126*(n>>16&255)+.7152*(n>>8&255)+.0722*(n&255))/255}
function measureTop(src){return new Promise((res,rej)=>{const im=new Image();im.onerror=rej;im.onload=()=>{try{
  const w=48,h=Math.max(1,Math.round(w*im.height/im.width)),c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');x.drawImage(im,0,0,w,h);const d=x.getImageData(0,0,w,Math.max(1,Math.round(h*.2))).data;
  let t=0;for(let i=0;i<d.length;i+=4)t+=(.2126*d[i]+.7152*d[i+1]+.0722*d[i+2])/255;res(t/(d.length/4))}catch(e){rej(e)}};im.src=src})}
async function refreshLum(){state.bgLum=null;const s=state.meta.bgImage;if(s){try{state.bgLum=await measureTop(s)}catch(e){}}applyBg()}
const bgv=k=>state.meta[k]??BGD[k];
function applyBg(){
  const r=document.documentElement,L=$('#bgLayer'),img=state.meta.bgImage;
  r.style.setProperty('--veil',String(bgv('bgVeil')/100));
  r.style.setProperty('--panel-a',(100-bgv('bgPanel'))+'%');
  r.style.setProperty('--bz',String(bgv('bgZoom')/100));
  r.style.setProperty('--bx',bgv('bgX')+'%');r.style.setProperty('--by',bgv('bgY')+'%');
  const url=img?`url("${img}")`:'';

function mountBg(s){
  const prev=$('#bg-prev',s),rm=$('#bg-rm',s),lbl=$('#bg-lbl',s),adj=$('#bg-adj',s),empty=$('#bg-empty',s);
  try{prev.style.aspectRatio=`${window.innerWidth} / ${window.innerHeight}`}catch(e){}
  const map={'bg-veil':'bgVeil','bg-panel':'bgPanel'},zb=$('#bg-zb',s);
  const showZoom=()=>{zb.textContent=Math.round(bgv('bgZoom'))+'%'};
  const sync=()=>{const img=!!state.meta.bgImage;empty.hidden=img;rm.hidden=!img;adj.hidden=!img;zb.hidden=!img;$('#bg-howto',s).hidden=!img;lbl.textContent=img?'画像を変える':'画像を選ぶ'};
  const resetPos=()=>{['bgZoom','bgX','bgY'].forEach(k=>setMeta(k,BGD[k]));showZoom();applyBg()};
  applyBg();sync();
  $('#bg-file',s).onchange=async x=>{const f=x.target.files&&x.target.files[0];if(!f)return;try{const p=await compress(f,2400);setMeta('bgImage',p.full);resetPos();sync();refreshLum();toast('背景画像を設定しました')}catch(e){toast('この画像は読み込めませんでした')}};
  rm.onclick=()=>{setMeta('bgImage',null);applyBg();sync();toast('背景画像を外しました')};
  Object.entries(map).forEach(([id,k])=>{const r=$('#'+id,s),o=$('#'+id+'-out',s);
    r.oninput=()=>{o.textContent=r.value+'%';state.meta[k]=Number(r.value);applyBg()};
    r.onchange=()=>setMeta(k,Number(r.value))});
  $('#bg-reset',s).onclick=resetPos;
  $$('[data-hdpick]',s).forEach(b=>b.onclick=()=>{setMeta('bgText',b.dataset.hdpick);applyBg();
    $$('[data-hdpick]',s).forEach(x=>{const on=x===b;x.classList.toggle('is-on',on);x.setAttribute('aria-checked',on)})});
  /* 画像を直接さわって調整：1本指=移動、2本指=拡大縮小、ホイール=拡大縮小 */
  const pts=new Map();let drag=null,pinch=null;
  const clampP=v=>Math.min(100,Math.max(0,v)),clampZ=v=>Math.min(300,Math.max(100,v));
  const dist=()=>{const [a,b]=[...pts.values()];return Math.hypot(a.x-b.x,a.y-b.y)||1};
  const startDrag=p=>{drag={x:p.x,y:p.y,bx:bgv('bgX'),by:bgv('bgY')}};
  const save=()=>['bgX','bgY','bgZoom'].forEach(k=>setMeta(k,Math.round(bgv(k))));
  prev.addEventListener('pointerdown',e=>{if(!state.meta.bgImage)return;try{prev.setPointerCapture(e.pointerId)}catch(_){}
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1)startDrag(pts.get(e.pointerId));
    else if(pts.size===2){drag=null;pinch={d0:dist(),z0:bgv('bgZoom')}}});
  prev.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch&&pts.size>=2){state.meta.bgZoom=clampZ(pinch.z0*dist()/pinch.d0);showZoom();applyBg();return}
    if(drag){const z=bgv('bgZoom')/100;
      state.meta.bgX=clampP(drag.bx-(e.clientX-drag.x)/prev.clientWidth*100/z);
      state.meta.bgY=clampP(drag.by-(e.clientY-drag.y)/prev.clientHeight*100/z);applyBg()}});
  const end=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
    if(pts.size<2)pinch=null;
    if(pts.size===1)startDrag([...pts.values()][0]);
    if(pts.size===0){drag=null;save()}};
  prev.addEventListener('pointerup',end);prev.addEventListener('pointercancel',end);
  let wT;prev.addEventListener('wheel',e=>{if(!state.meta.bgImage)return;e.preventDefault();
    state.meta.bgZoom=clampZ(bgv('bgZoom')+(e.deltaY<0?8:-8));showZoom();applyBg();clearTimeout(wT);wT=setTimeout(save,300)},{passive:false});
}

function themeSec(){
  const cur=state.meta.theme||'auto',order=['sage','ink','amber','cobalt','rose','night','auto'];
  const tile=t=>t.id==='auto'?`<span class="th-tile" style="background:linear-gradient(90deg,#e9ede8 50%,#1b221f 50%)"><i style="background:#285847"></i></span>`:`<span class="th-tile" style="background:${t.sw[0]}"><i style="background:${t.sw[2]}"></i></span>`;
  return `<p class="set-note">読んだ・観たの色は、どのテーマでも緑と茶のままです。</p><div class="th-list" role="radiogroup" aria-label="テーマカラー">${order.map(id=>THEMES.find(t=>t.id===id)).map(t=>`<button type="button" role="radio" class="th-row${t.id===cur?' is-on':''}" aria-checked="${t.id===cur}" data-theme-pick="${t.id}">${tile(t)}<span class="th-name">${t.name}${t.id==='auto'?'<small>昼はセージ、夜は暗い配色</small>':''}</span><span class="ck">${icon('check')}</span></button>`).join('')}</div>`;
}
function exportSec(){
  const last=state.meta.lastExport?new Date(state.meta.lastExport):null;
  return `<p class="set-note">${last?`最後に書き出した日：${last.getFullYear()}年${last.getMonth()+1}月${last.getDate()}日`:'まだ書き出していません'}。写真も含めて全データをテキストにします。コピーして、メモアプリなどに保存しておいてください。</p>
    <div class="stack"><button type="button" class="btn-primary" id="d-exp">書き出す</button><textarea id="d-out" class="set-ta" readonly hidden aria-label="書き出したデータ"></textarea><button type="button" class="btn-ghost" id="d-copy" hidden>コピー</button><button type="button" class="btn-ghost" id="d-dl" hidden>ファイルに保存</button></div>`;
}
function importSec(){
  return `<p class="set-note">書き出したデータで、今のデータをすべて置き換えます。ファイルを選ぶか、テキストを貼り付けてください。</p>
    <div class="stack"><label class="btn-ghost" style="color:var(--fg);font-size:.9rem;cursor:pointer">ファイルを選ぶ<input type="file" id="d-file" accept=".json,application/json,text/plain" hidden></label><textarea id="d-in" class="set-ta" placeholder="ここに貼り付け" aria-label="読み込むデータ"></textarea><button type="button" class="btn-danger" id="d-imp" style="border:1px solid var(--line)">読み込む</button></div>`;
}
function mountTheme(s){
  $$('[data-theme-pick]',s).forEach(b=>b.onclick=()=>{const id=b.dataset.themePick;applyTheme(id);setMeta('theme',id);applyBg();
    $$('[data-theme-pick]',s).forEach(x=>{const on=x===b;x.classList.toggle('is-on',on);x.setAttribute('aria-checked',on)})});
}
function mountFree(s){
  const aws=$('#aw-s',s),awe=$('#aw-e',s),saveAw=()=>{const a=+aws.value,b=+awe.value;
    if(b<=a){toast('寝る時刻は起きる時刻より後にしてください');const[A,B]=awake();aws.value=A;awe.value=B;return}
    setMeta('awakeS',a);setMeta('awakeE',b);renderSchedule();toast('自由時間の範囲を変えました')};
  aws.onchange=saveAw;awe.onchange=saveAw;
}
function mountExport(s){
  $('#d-exp',s).onclick=()=>{const data={app:'schedule-diary',version:1,exportedAt:nowIso(),events:state.events,entries:state.entries,reminders:state.reminders,todoCats:state.meta.todoCats||[],categories:CATS,photos:[...state.photos.values()]};
    const o=$('#d-out',s);o.value=JSON.stringify(data);o.hidden=false;$('#d-copy',s).hidden=false;if(window.self===window.top){const dl=$('#d-dl',s);dl.hidden=false;dl.onclick=()=>{try{const url=URL.createObjectURL(new Blob([o.value],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=`day-oneness-${today().replace(/-/g,'')}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('ファイルに保存しました')}catch(e){toast('保存できませんでした。コピーを使ってください')}}}setMeta('lastExport',nowIso());renderHeader();o.select()};
  $('#d-copy',s).onclick=()=>{const o=$('#d-out',s);try{navigator.clipboard.writeText(o.value).then(()=>toast('コピーしました'),()=>{o.select();toast('選択した文字をコピーしてください')})}catch(e){o.select();toast('選択した文字をコピーしてください')}};
}
function mountImport(s){
  $('#d-file',s).onchange=x=>{const f=x.target.files&&x.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{$('#d-in',s).value=fr.result;toast('ファイルを読み込みました。「読み込む」を押してください')};fr.readAsText(f)};
  const imp=$('#d-imp',s);
  imp.addEventListener('click',async()=>{let d;try{d=JSON.parse($('#d-in',s).value)}catch(e){toast('データの形式が正しくありません');return}
    if(!d||d.app!=='schedule-diary'||!Array.isArray(d.events)||!Array.isArray(d.entries)){toast('このアプリのデータではありません');return}
    if(!imp.classList.contains('armed')){imp.classList.add('armed');imp.textContent='もう一度押して置き換え';return}
    await Promise.all(['events','entries','photos','reminders'].map(clearStore));
    state.reminders=Array.isArray(d.reminders)?d.reminders:[];state.reminders.forEach(o=>put('reminders',o));
    if(Array.isArray(d.todoCats))setMeta('todoCats',d.todoCats);
    state.events=d.events;state.entries=d.entries;state.photos=new Map();
    d.events.forEach(o=>put('events',o));d.entries.forEach(o=>put('entries',o));(d.photos||[]).forEach(p=>{state.photos.set(p.id,p);put('photos',p)});
    render();setPage(state.prevPage||'day');toast('データを読み込みました')});
}
const SET_SECS={theme:[themeSec,mountTheme],bg:[bgSec,mountBg],free:[freeSec,mountFree],export:[exportSec,mountExport],import:[importSec,mountImport]};
function renderSettings(){
  const wide=window.innerWidth>=600;state.setWide=wide;
  if(wide&&!state.setSec)state.setSec='theme';
  const sec=state.setSec,wrap=$('#setWrap');
  wrap.dataset.sub=sec?'1':'';
  $('#setTitle').textContent=!wide&&sec?setLabel(sec):'設定';
  $('#setNav').innerHTML=SET_GROUPS.map(g=>`<p class="set-g">${g.g}</p><div class="set-list">${g.items.map(([k,l,ic])=>`<button type="button" class="set-item${wide&&sec===k?' is-on':''}" data-set="${k}"${wide&&sec===k?' aria-current="true"':''}>${icon(ic)}<span>${l}</span>${icon('chevR')}</button>`).join('')}</div>`).join('');
  const body=$('#setBody');
  if(sec&&SET_SECS[sec]){const [html,mount]=SET_SECS[sec];body.innerHTML=`<h2 class="set-h">${setLabel(sec)}</h2>${html()}`;mount(body)}else body.innerHTML='';
}
function openSettings(){
  if(state.page!=='set')state.prevPage=state.page;
  state.setSec=null;renderSettings();setPage('set');window.scrollTo(0,0);
}
function settingsBack(){
  if(!state.setWide&&state.setSec){state.setSec=null;renderSettings();window.scrollTo(0,0);return}
  setPage(state.prevPage||'day');
}

/* ---------- 操作 ---------- */
let toastT;function toast(m,ms=2200){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,ms)}
function go(d){state.date=d;setView(d);render()}

$('#openData').innerHTML=icon('more');$('#openMonth').innerHTML=icon('cal');
$$('.pane-add').forEach(b=>b.innerHTML=icon('plus')+(b.dataset.add==='event'?'追加':'記録を追加'));
$('#openMonth').onclick=openMonthSheet;
$('#openData').onclick=openSettings;
$('#setBack').innerHTML=icon('chevL');$('#setBack').onclick=settingsBack;
$('#setNav').addEventListener('click',e=>{const b=e.target.closest('[data-set]');if(!b)return;state.setSec=b.dataset.set;renderSettings();if(!state.setWide)window.scrollTo(0,0)});
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(state.page==='set'&&(window.innerWidth>=600)!==state.setWide)renderSettings()},150)});

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-photo],[data-mnav],[data-date],[data-event],[data-entry],[data-add],[data-close],[data-clear-samples]');if(!t)return;
  const ds=t.dataset;
  if(ds.photo!==undefined){e.stopPropagation();openPhoto(ds.photo);return}
  if(ds.mnav!==undefined){const v=state.view;const d=new Date(v.y,v.m+Number(ds.mnav),1);state.view={y:d.getFullYear(),m:d.getMonth()};renderMonthAll();return}
  if(ds.date!==undefined){const inSheet=!!t.closest('#sheet');go(ds.date);if(inSheet)closeSheet();return}
  if(ds.event!==undefined){openEventActions(ds.event);return}
  if(ds.entry!==undefined){const en=state.entries.find(x=>x.id===ds.entry);if(en)openEntryForm(en.kind,en);return}
  if(ds.add!==undefined){ds.add==='event'?openEventForm():ds.add==='entry'?openEntryChooser():openAddChooser();return}
  if(ds.close!==undefined){closeSheet();return}
  if(ds.clearSamples!==undefined){clearSamples()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!sheet.hidden){closeSheet();return}
  if(e.key==='Enter'&&e.target.matches('.card[data-entry]')){e.preventDefault();e.target.click();return}
  if(!sheet.hidden&&e.key!=='Escape')return;
  if(e.key==='Escape'&&state.page==='set'&&sheet.hidden){settingsBack();return}
  if(!sheet.hidden||state.page!=='day'||e.target.closest('input,textarea'))return;
  if(e.key==='ArrowLeft'&&!e.target.closest('.sched,.week,.cal-grid'))go(addDays(state.date,-1));
  if(e.key==='ArrowRight'&&!e.target.closest('.sched,.week,.cal-grid'))go(addDays(state.date,1));
});
let sx=0,sy=0;const main=$('.layout');
main.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});
main.addEventListener('touchend',e=>{if(window.innerWidth>=600||state.page!=='day')return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>60&&Math.abs(dy)<50)setPane(dx<0?'rec':'sched')},{passive:true});
function setPane(p){
  if(main.dataset.show===p)return;main.dataset.show=p;
  $$('.pg-dots [data-pane]').forEach(b=>{const on=b.dataset.pane===p;b.classList.toggle('is-on',on);b.setAttribute('aria-selected',on)});
  const el=$(`[data-pane-id="${p}"]`);el.classList.remove('slide-l','slide-r');void el.offsetWidth;el.classList.add(p==='rec'?'slide-l':'slide-r');
}
$$('.pg-dots [data-pane]').forEach(b=>b.onclick=()=>setPane(b.dataset.pane));

/* 下部のページ切り替えバー */
document.documentElement.dataset.page='day';
$('#navDay').innerHTML=icon('cal');$('#navRem').innerHTML=icon('checklist');$('#navAdd').innerHTML=icon('plus');
function setPage(p){
  if(state.page===p){if(p==='day'&&state.date!==today())go(today());return}
  state.page=p;document.documentElement.dataset.page=p;
  [['navDay','day'],['navRem','rem']].forEach(([id,v])=>{const b=$('#'+id),on=v===p;b.classList.toggle('is-on',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  renderHeader();window.scrollTo(0,0);
}
$('#navDay').onclick=()=>setPage('day');
$('#navRem').onclick=()=>setPage('rem');
$('#navAdd').onclick=()=>{if(state.page==='rem')return openReminderForm();if(window.innerWidth<600)return main.dataset.show==='rec'?openEntryChooser():openEventForm();openAddChooser()};
$('#remList').addEventListener('click',e=>{const t=e.target.closest('[data-tf],[data-catedit],[data-rem-toggle],[data-rem],[data-rem-done]');if(!t)return;
  if(t.dataset.tf){state.todoFilter=t.dataset.tf;renderReminders();return}
  if(t.dataset.catedit!==undefined){openCatManager();return}
  if(t.dataset.remToggle){toggleRem(t.dataset.remToggle,t.closest('.rem'));return}
  if(t.dataset.rem){openTodoActions(t.dataset.rem);return}
  state.showDone=!state.showDone;renderReminders()});

async function init(){
  let saved='auto';try{saved=localStorage.getItem('sd-theme')||'auto'}catch(e){}
  applyTheme(saved);
  setView(state.date);render();
  idb=await openDB();
  const [ev,en,ph,meta,rms]=await Promise.all(STORES.map(getAll));
  state.events=ev;state.entries=en;state.reminders=rms;ph.forEach(p=>state.photos.set(p.id,p));meta.forEach(m=>state.meta[m.id]=m.value);
  if(state.meta.theme)applyTheme(state.meta.theme);
  applyBg();refreshLum();
  if(!state.meta.seeded){seedSamples();setMeta('seeded',true)}
  if(!state.meta.seededRem){seedReminders();setMeta('seededRem',true)}
  ensureTodoCats();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}
  render();
}
init();
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})})}
</script>
</body>
</html>
