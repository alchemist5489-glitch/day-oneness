<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Day Oneness</title>
<meta name="application-name" content="Day Oneness">
<meta name="apple-mobile-web-app-title" content="Day Oneness">
<meta name="theme-color" content="#2b5a47">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: 一日を中心に、画面幅で S=縦積み / M=週ストリップ+2カラム / L=月カレンダー+2カラム */
:root{
  --bg:#e8ece6; --surface:#fbfbf8; --surface-2:#f1f4ef; --line:#dce3d9;
  --fg:#1e2a24; --muted:#67746c; --accent:#2b5a47; --accent-fg:#ffffff; --accent-soft:#dde8e1;
  --read:#33634d; --read-soft:#e0ebe4; --watch:#94562b; --watch-soft:#f2e5d9;
  --done:#474d8a; --done-soft:#e5e6f4; --thought:#773d6b; --thought-soft:#f2e3ee;
  --photo:#e2e7df; --danger:#b3412f; --scrim:rgba(20,30,25,.38);
  --font:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,system-ui,sans-serif;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131816; --surface:#1b221f; --surface-2:#212a26; --line:#2e3934;
  --fg:#e5ebe7; --muted:#94a199; --accent:#7fb89c; --accent-fg:#0f1f18; --accent-soft:#233a2f;
  --read:#8cc2a6; --read-soft:#21352b; --watch:#e3a576; --watch-soft:#38291e;
  --done:#afb3ef; --done-soft:#282b45; --thought:#e3a8d4; --thought-soft:#382536;
  --photo:#26302b; --danger:#ef8a78; --scrim:rgba(0,0,0,.55); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#131816; --surface:#1b221f; --surface-2:#212a26; --line:#2e3934;
  --fg:#e5ebe7; --muted:#94a199; --accent:#7fb89c; --accent-fg:#0f1f18; --accent-soft:#233a2f;
  --read:#8cc2a6; --read-soft:#21352b; --watch:#e3a576; --watch-soft:#38291e;
  --done:#afb3ef; --done-soft:#282b45; --thought:#e3a8d4; --thought-soft:#382536;
  --photo:#26302b; --danger:#ef8a78; --scrim:rgba(0,0,0,.55); color-scheme:dark }

/* テーマカラー（設定で選んだときだけ適用。読んだ=緑・観た=茶はどのテーマでも共通） */
html:root[data-palette]:not([data-palette="night"]){--accent-fg:#ffffff;--read:#33634d;--read-soft:#e0ebe4;--watch:#94562b;--watch-soft:#f2e5d9;--done:#474d8a;--done-soft:#e5e6f4;--thought:#773d6b;--thought-soft:#f2e3ee;--danger:#b3412f;--scrim:rgba(20,30,25,.38);color-scheme:light}
html:root[data-palette="sage"]{--bg:#e9ede8;--surface:#fffffa;--surface-2:#f1f4ef;--line:#dce3d9;--fg:#1e2a24;--muted:#67746c;--accent:#285847;--accent-soft:#dde8e1;--photo:#e2e7df}
html:root[data-palette="ink"]{--bg:#e9eff7;--surface:#fbfdff;--surface-2:#f0f4fa;--line:#d8e1ec;--fg:#1b2533;--muted:#617084;--accent:#244b78;--accent-soft:#dde6f2;--photo:#e6edf6}
html:root[data-palette="amber"]{--bg:#f4eadb;--surface:#fffcf4;--surface-2:#f8f1e6;--line:#eadcc8;--fg:#2e2418;--muted:#78685a;--accent:#8b4e22;--accent-soft:#f1e1cf;--photo:#f1e6d8}
html:root[data-palette="cobalt"]{--bg:#dceaff;--surface:#ffffff;--surface-2:#eef4ff;--line:#d3e0f5;--fg:#14213a;--muted:#5b6983;--accent:#1553db;--accent-soft:#dbe7ff;--photo:#dce8fd}
html:root[data-palette="rose"]{--bg:#f1e7e8;--surface:#fffdfd;--surface-2:#f8f0f1;--line:#eadadd;--fg:#2d2023;--muted:#78656a;--accent:#8a4256;--accent-soft:#f2e0e5;--photo:#f1e5e7}
html:root[data-palette="night"]{--bg:#171e29;--surface:#232b3a;--surface-2:#1c2432;--line:#333d50;--fg:#e6ebf3;--muted:#9aa5b7;--accent:#afc7f3;--accent-fg:#142036;--accent-soft:#2d3b56;--read:#8cc2a6;--read-soft:#22352d;--watch:#e3a576;--watch-soft:#3a2b20;--done:#b3b7f0;--done-soft:#2b2e48;--thought:#e3a8d4;--thought-soft:#3a2638;--photo:#1b2230;--danger:#ef8a78;--scrim:rgba(0,0,0,.55);color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}

.app{position:relative;z-index:1;max-width:1440px;margin:0 auto;min-height:calc(100vh + 1px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(118px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){.app{padding-block:0 100px}}

/* ヘッダー */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 12px}
.hd-date{display:flex;align-items:baseline;gap:10px;min-width:0}
.hd-date h1{margin:0;font-size:1.6rem;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.dow{color:var(--muted);font-weight:500}
.today-pill{align-self:center;margin-left:4px;font-size:.8rem;font-weight:700;line-height:1;padding:8px 16px;border-radius:999px;letter-spacing:.04em;white-space:nowrap;background:var(--accent-soft);color:var(--accent)}
.today-pill.is-today{cursor:default}
.today-pill:not(.is-today){background:var(--accent);color:var(--accent-fg)}
.hd-actions{display:flex;align-items:center;gap:2px}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:10px;color:var(--fg);position:relative}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn.has-alert::after{content:"";position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--watch)}
.text-btn{height:40px;padding:0 10px;border-radius:10px;font-weight:700;color:var(--accent)}
.text-btn:hover{background:var(--surface-2)}
@media (min-width:1024px){.only-sm{display:none!important}}

/* 週ストリップ（M） */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px;margin-bottom:12px}
@media (min-width:600px){.week{gap:4px;padding:8px}}
@media (min-width:1024px){.week{display:none}}
.wk-day{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 7px;border-radius:var(--r-sm);color:var(--muted)}
.wk-day b{font-size:1.15rem;color:var(--fg);font-weight:700}
.wk-day small{font-size:.72rem}
.wk-day:hover{background:var(--surface-2)}
.wk-day.is-sel{background:var(--accent);color:var(--accent-fg)}
.wk-day.is-sel b{color:var(--accent-fg)}
.dots{display:flex;gap:3px;height:5px}
.dot{width:5px;height:5px;border-radius:50%}
.dot.ev{background:var(--accent)} .dot.en{background:var(--watch)}
.wk-day.is-sel .dot{background:var(--accent-fg)}

/* お知らせ */
.notice{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surface-2);border:1px dashed var(--line);border-radius:var(--r-sm);padding:8px 12px;margin-bottom:12px;font-size:.85rem;color:var(--muted)}
.notice button{font-weight:700;color:var(--accent);font-size:.85rem}

/* レイアウト */
.layout{display:grid;gap:12px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:600px){.layout{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr)}}
@media (min-width:1024px){.layout{grid-template-columns:300px minmax(0,.9fr) minmax(0,1.35fr)}}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
@media (min-width:600px){.pane{min-height:420px}}
.cal-pane{display:none}
@media (min-width:1024px){.cal-pane{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}}
.pane-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.pane-head h2{margin:0;font-size:1.1rem;font-weight:700}
.pane-add{display:none;align-items:center;gap:4px;font-size:.82rem;font-weight:700;color:var(--accent);padding:6px 8px;border-radius:8px}
.pane-add .ic{width:15px;height:15px}
.pane-add:hover{background:var(--surface-2)}
@media (min-width:600px){.pane-add{display:inline-flex}}

/* スケジュール */
.sched{list-style:none;margin:0;padding:0}
.sched li+li{border-top:1px solid var(--line)}
.sched button{width:100%;display:grid;grid-template-columns:56px minmax(0,1fr);align-items:baseline;gap:8px;text-align:left;padding:11px 4px;border-radius:8px}
.sched button:hover{background:var(--surface-2)}
.sched .t{color:var(--muted);font-size:.88rem}
.sched .t.allday{font-size:.75rem;font-weight:700;color:var(--read)}
.sched .ttl{font-weight:700;overflow-wrap:anywhere}
.sched .memo{display:block;font-weight:400;font-size:.82rem;color:var(--muted)}
.sched .linked{font-size:.7rem;font-weight:700;color:var(--watch);margin-left:6px}
.empty{color:var(--muted);font-size:.88rem;padding:12px 4px}

/* 記録：カード（読んだ・観た） */
.records{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--muted)}
.card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-head h3{margin:0;font-size:1rem;font-weight:700;overflow-wrap:anywhere}
.card p{margin:0;color:var(--fg);opacity:.85;font-size:.9rem;overflow-wrap:anywhere;white-space:pre-wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:6px;letter-spacing:.03em}
.chip .ic{width:14px;height:14px}
.chip.read{background:var(--read-soft);color:var(--read)}
.chip.watch{background:var(--watch-soft);color:var(--watch)}
.chip.done{background:var(--done-soft);color:var(--done)}
.chip.thought{background:var(--thought-soft);color:var(--thought)}
.thumb{display:block;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:8px;overflow:hidden;background:var(--photo);margin-top:2px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}

/* 記録：リスト（やれたこと・思ったこと） */
.notes{display:grid;gap:14px;margin-top:6px}
@media (min-width:1024px){.notes.two{grid-template-columns:1fr 1fr}}
.note-group ul{list-style:none;margin:6px 0 0;padding:0}
.note-group li button{width:100%;display:flex;gap:10px;text-align:left;padding:7px 4px;border-radius:8px;font-size:.92rem;overflow-wrap:anywhere}
.note-group li button:hover{background:var(--surface-2)}
.note-group li button::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;margin-top:.62em;background:currentColor;opacity:.5}
.note-group.done li button::before{background:var(--done);opacity:1}
.note-group.thought li button::before{background:var(--thought);opacity:1}
.section-sep{height:1px;background:var(--line);margin:6px 0 2px}

/* 月カレンダー */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cal-head h2{margin:0;font-size:1.05rem;font-weight:700}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-dow{font-size:.75rem;color:var(--muted);padding:4px 0}
.cal-day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0 4px;border-radius:9px;font-size:.88rem}
.cal-day:hover{background:var(--surface-2)}
.cal-day .num{width:30px;height:30px;display:grid;place-items:center;border-radius:8px}
.cal-day.is-today .num{box-shadow:inset 0 0 0 1.5px var(--accent)}
.cal-day.is-sel .num{background:var(--accent);color:var(--accent-fg);font-weight:700}
.cal-legend{display:flex;gap:14px;margin-top:10px;font-size:.75rem;color:var(--muted)}
.cal-legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}

/* 下部の追加ボタン（S） */
.fab-bar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding-top:12px;background:linear-gradient(to top,var(--bg) 60%,transparent)}
#fab{width:100%;height:calc(58px + env(safe-area-inset-bottom,0px));padding:0 max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));border-radius:18px 18px 0 0;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:1.05rem;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;gap:6px}
@media (min-width:600px){.fab-bar{display:none}}

/* シート */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;z-index:41;background:var(--surface);left:0;right:0;bottom:0;border-radius:18px 18px 0 0;max-height:88vh;overflow:auto;padding:6px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:0 -6px 30px rgba(0,0,0,.15)}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 6px}
@media (min-width:600px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(540px,92vw);max-height:86vh;border-radius:18px;padding:8px 22px 22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .sheet::before{display:none}
}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:6px 0 10px}
.sheet-head h2{margin:0;font-size:1.1rem}
.form{display:flex;flex-direction:column;gap:14px}
.form label,.field-label{display:flex;flex-direction:column;gap:6px;font-size:.82rem;font-weight:700;color:var(--muted)}
.form input[type=date],.form input[type=time],.form input:not([type]),.form input[type=text],.form input[type=number]:not(.num-row input),.form textarea{width:100%;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:1rem;font-weight:400;color:var(--fg)}
.form textarea{resize:vertical;min-height:84px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{margin:-6px 0 0;font-size:.78rem;color:var(--muted)}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cats label{flex-direction:row;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;font-weight:500;color:var(--fg);font-size:.88rem;cursor:pointer}
.cats input{position:absolute;opacity:0;pointer-events:none}
.cats label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.cats label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.photo-field{display:flex;flex-direction:column;gap:8px}
.photo-prev img{width:100%;max-height:240px;object-fit:cover;border-radius:10px;display:block}
.photo-btns{display:flex;gap:8px;flex-wrap:wrap}
.form-actions{display:flex;align-items:center;gap:8px;margin-top:4px}
.spacer{flex:1}
.btn-primary,.btn-ghost,.btn-danger{height:44px;padding:0 18px;border-radius:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--accent);color:var(--accent-fg)}
.btn-ghost{background:var(--surface-2);border:1px solid var(--line)}
.btn-danger{color:var(--danger)}
.btn-danger.armed{background:var(--danger);color:var(--surface)}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{display:flex;align-items:center;gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px;text-align:left}
.choice:hover{background:var(--surface-2)}
.choice small{display:block;color:var(--muted);font-size:.75rem}
.choice .ico{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none}
.choice.event .ico{background:var(--accent-soft);color:var(--accent)}
.choice.read .ico{background:var(--read-soft);color:var(--read)}
.choice.watch .ico{background:var(--watch-soft);color:var(--watch)}
.choice.done .ico{background:var(--done-soft);color:var(--done)}
.choice.thought .ico{background:var(--thought-soft);color:var(--thought)}
.choice.wide{grid-column:1/-1}
.group-label{margin:14px 0 6px;font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.06em}
.ev-detail{padding:4px 0 14px}
.ev-detail .big{font-size:1.15rem;font-weight:700;margin:0}
.ev-detail p{margin:4px 0 0;color:var(--muted);white-space:pre-wrap}
.stack{display:flex;flex-direction:column;gap:8px}
.viewer{width:100%;border-radius:10px;display:block}
.data-sec{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.data-sec:first-child{border-top:0;margin-top:0;padding-top:0}
.data-sec h3{margin:0 0 4px;font-size:.95rem}
.form label.check{flex-direction:row;align-items:center;gap:10px;color:var(--fg);font-weight:500;font-size:.9rem;cursor:pointer}
.form label.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.sp-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:2px}
.tdy{font-size:.68rem;font-weight:700;letter-spacing:.05em;line-height:1.15;color:var(--accent)}
.wk-day.is-sel .tdy{color:var(--accent-fg)}
.cal-day .tdy{font-size:.62rem;margin-top:-2px}
.bg-layer{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg-img{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat;background-position:var(--bx,50%) var(--by,50%);transform-origin:var(--bx,50%) var(--by,50%);transform:scale(var(--bz,1))}
.bg-layer::after,.bg-prev-veil{content:"";position:absolute;inset:0;background:var(--bg);opacity:var(--veil,.4)}
html.has-bgimg .topbar{background:transparent;position:relative;top:auto}
html.has-bgimg body::before{background:transparent}
html.has-bgimg .fab-bar{background:none}
.bg-prev-wrap{display:flex;justify-content:center;margin-bottom:10px}
.bg-zb{position:absolute;right:8px;bottom:8px;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.55);color:#ffffff;pointer-events:none}
.bg-howto{margin:-2px 0 12px;text-align:center}
.bg-prev{position:relative;overflow:hidden;height:300px;aspect-ratio:9/16;max-width:100%;border-radius:10px;background:var(--photo);border:1px solid var(--line);touch-action:none;cursor:grab;user-select:none}
.bg-prev:active{cursor:grabbing}
.bg-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:.82rem}
.veil-l{min-width:4.6em}
/* スマホ：スケジュール↔記録の切り替え */
.pager{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.pager button{flex:1;padding:8px 0;border-radius:9px;font-weight:700;font-size:.9rem;color:var(--muted)}
.pager button.is-on{background:var(--accent-soft);color:var(--accent)}
.pg-dots{display:none;justify-content:center;margin:0}
@media (max-width:599px){html[data-page="day"] .pg-dots{display:flex}}

/* ページ切り替え：一日のページ / ToDo */

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const nowIso=()=>new Date().toISOString();
const uid=()=>{try{if(crypto.randomUUID)return crypto.randomUUID()}catch(e){}return 'id-'+Date.now().toString(36)+Math.random().toString(36).slice(2,10)};
const DOW=['日','月','火','水','木','金','土'];

const ICONS={
  manga:'<path d="M4 5h16v11H9l-4 3v-3H4z"/><path d="M8 9h8M8 12h5"/>',
  novel:'<path d="M3 6c3-1 6-1 9 1 3-2 6-2 9-1v12c-3-1-6-1-9 1-3-2-6-2-9-1z"/><path d="M12 7v12"/>',
  shinsho:'<rect x="6" y="3" width="12" height="18" rx="1.5"/><path d="M10 3v18M13 8h3M13 11h3"/>',
  magazine:'<rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M8 8h8M8 12h3M8 16h3M14 12h2v4h-2z"/>',
  movie:'<rect x="4" y="10" width="16" height="10" rx="1.5"/><path d="M4 10l15-4 1 3.5M8.5 8.8l1.8-3.2M13.5 7.5l1.8-3.2"/>',
  drama:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 3l4 4 4-4M12 11v5M9.5 13.5h5"/>',
  anime:'<path d="M2.5 13s3.8-5.5 9.5-5.5S21.5 13 21.5 13 17.7 18.5 12 18.5 2.5 13 2.5 13z"/><circle cx="12" cy="13" r="2.8"/><path d="M12 3v2M5.5 5l1.4 1.4M18.5 5l-1.4 1.4"/>',
  net:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/>',
  photo:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  sparkle:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M18.5 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/>',
  repeat:'<path d="M17 3l3 3-3 3"/><path d="M4 11V9a3 3 0 0 1 3-3h13"/><path d="M7 21l-3-3 3-3"/><path d="M20 13v2a3 3 0 0 1-3 3H4"/>',
  grid:'<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>',
  upload:'<path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M4 14v5a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/>',
  download:'<path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M4 14v5a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/>',
  chevU:'<path d="M6 15l6-6 6 6"/>', chevD:'<path d="M6 9l6 6 6-6"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
  checklist:'<rect x="4" y="3.5" width="16" height="17" rx="2"/><path d="M8 9l1.4 1.4L12 8M8 15l1.4 1.4L12 14M14.5 9.5H17M14.5 15.5H17"/>',
  cal:'<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4M8 13.5h.01M12 13.5h.01M16 13.5h.01M8 17h.01M12 17h.01"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  moon:'<path d="M19.5 14.5A7.5 7.5 0 1 1 9.5 4.5a6 6 0 0 0 10 10z"/>',
  habit:'<path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M8.5 12l2.6 2.6L20 5.5"/>',
  bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/>',
  chevL:'<path d="M15 6l-6 6 6 6"/>', chevR:'<path d="M9 6l6 6-6 6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', close:'<path d="M6 6l12 12M18 6L6 18"/>',
  more:'<circle cx="5.5" cy="12" r=".9"/><circle cx="12" cy="12" r=".9"/><circle cx="18.5" cy="12" r=".9"/>'
};
const icon=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||''}</svg>`;

const CATS=[
  {id:'cat-manga',group:'read',name:'漫画',icon:'manga',unit:'巻',numLabel:'巻数'},
  {id:'cat-novel',group:'read',name:'小説',icon:'novel'},
  {id:'cat-shinsho',group:'read',name:'新書',icon:'shinsho'},
  {id:'cat-magazine',group:'read',name:'雑誌',icon:'magazine'},
  {id:'cat-movie',group:'watched',name:'映画',icon:'movie'},
  {id:'cat-drama',group:'watched',name:'ドラマ',icon:'drama',unit:'話',numLabel:'話数'},
  {id:'cat-anime',group:'watched',name:'アニメ',icon:'anime',unit:'話',numLabel:'話数'},
  {id:'cat-net',group:'watched',name:'ネット動画',icon:'net',unit:'パート',numLabel:'パート数'}
];
const catById=id=>CATS.find(c=>c.id===id);
const KINDS={
  read:{label:'読んだ',icon:'novel',cls:'read',sub:'漫画・小説・新書・雑誌'},
  watched:{label:'観た',icon:'movie',cls:'watch',sub:'映画・ドラマ・アニメ・動画'},
  done:{label:'やれたこと',icon:'check',cls:'done',sub:'できたことを一行で'},
  thought:{label:'思ったこと',icon:'bulb',cls:'thought',sub:'感じたことを一行で'}
};
const isMedia=k=>k==='read'||k==='watched';

/* ---------- 保存（IndexedDB） ---------- */
const STORES=['events','entries','photos','meta','reminders','habits','habitLogs'];
let idb=null;
function openDB(){return new Promise(res=>{try{
  const r=indexedDB.open('schedule-diary',3);
  r.onupgradeneeded=()=>{const d=r.result;STORES.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})})};
  r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); r.onblocked=()=>res(null);
}catch(e){res(null)}})}
function getAll(s){return new Promise(res=>{if(!idb)return res([]);try{const q=idb.transaction(s).objectStore(s).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])}catch(e){res([])}})}
function put(s,o){if(!idb)return;try{idb.transaction(s,'readwrite').objectStore(s).put(o)}catch(e){}}
function hardDel(s,id){if(!idb)return;try{idb.transaction(s,'readwrite').objectStore(s).delete(id)}catch(e){}}
function clearStore(s){return new Promise(res=>{if(!idb)return res();try{const q=idb.transaction(s,'readwrite').objectStore(s).clear();q.onsuccess=()=>res();q.onerror=()=>res()}catch(e){res()}})}

const state={date:today(),view:null,events:[],entries:[],reminders:[],habits:[],habitLogs:[],habView:'week',habAnchor:null,photos:new Map(),meta:{},page:'day',showDone:false,todoFilter:'all'};
function setView(d){const x=parse(d);state.view={y:x.getFullYear(),m:x.getMonth()}}
function setMeta(k,v){state.meta[k]=v;put('meta',{id:k,value:v})}
const alive=x=>!x.deletedAt;
const eventsOn=d=>state.events.filter(e=>alive(e)&&e.date===d).sort((a,b)=>(a.time||'')<(b.time||'')?-1:(a.time||'')>(b.time||'')?1:0);
const entriesOn=d=>state.entries.filter(e=>alive(e)&&e.date===d).sort((a,b)=>a.order-b.order);
function marks(){const ev=new Set(),en=new Set(),t=today();state.events.forEach(e=>alive(e)&&e.special&&e.date>=t&&ev.add(e.date));return{ev,en}}

function upsert(list,store,o){o.updatedAt=nowIso();if(!o.createdAt)o.createdAt=o.updatedAt;const i=list.findIndex(x=>x.id===o.id);if(i>=0)list[i]=o;else list.push(o);put(store,o)}
function softDelete(list,store,id){const o=list.find(x=>x.id===id);if(!o)return;o.deletedAt=nowIso();o.updatedAt=o.deletedAt;put(store,o);if(store==='entries'&&o.photoId){state.photos.delete(o.photoId);hardDel('photos',o.photoId)}}

function seedSamples(){
  const t=today(),S=true;
  const ev=(date,time,title,special=false)=>upsert(state.events,'events',{id:uid(),date,time,title,memo:'',special,sample:S});
  const en=(date,kind,categoryId,title,body,o)=>upsert(state.entries,'entries',{id:uid(),date,kind,categoryId,title,body,photoId:null,fromEventId:null,order:o,sample:S});
  ev(t,'12:30','昼休みに読書');ev(t,'19:00','買い物');ev(t,'20:00','映画を観る');ev(t,'22:00','明日の準備');
  en(t,'read','cat-novel','短編集を1話','最後の一文がよかった。',1);

const endLabel=e=>e.endTime?(e.endNext?(e.endTime==='00:00'?'24:00':'翌'+e.endTime):e.endTime):'';
const evDur=e=>{if(!e.time||!e.endTime)return 0;let d=toMin(e.endTime)-toMin(e.time);if(e.endNext)d+=1440;return Math.max(0,d)};
const fmtDur=m=>m<60?`${m}分`:`${Math.floor(m/60)}時間${m%60?pad(m%60)+'分':''}`;
function daySegs(date){
  const prev=addDays(date,-1),out=[];
  state.events.forEach(e=>{if(!alive(e)||!e.time)return;
    if(e.date===date){const s=toMin(e.time);let en=e.endTime?(e.endNext?1440:toMin(e.endTime)):s+30;if(en<=s)en=s+30;out.push({e,s,en:Math.min(en,1440),noend:!e.endTime,cont:false})}
    else if(e.date===prev&&e.endNext&&e.endTime&&e.endTime!=='00:00')out.push({e,s:0,en:toMin(e.endTime),noend:false,cont:true})});
  return out.sort((a,b)=>a.s-b.s||b.en-a.en);
}
function unionSegs(segs){const r=[];segs.map(x=>[x.s,x.en]).sort((a,b)=>a[0]-b[0]).forEach(([s,e])=>{const l=r[r.length-1];if(l&&s<=l[1])l[1]=Math.max(l[1],e);else r.push([s,e])});return r}
/* 就寝時間：毎日同じ／曜日ごと。寝る時刻は翌3:00（=27:00）まで */
function sleepCfg(){const m=state.meta.sleep;if(m&&m.all)return m;
  const w=state.meta.awakeS??420,b=state.meta.awakeE??1380,all={w,b:b>w?b:1380};return{auto:true,perDay:false,all,days:Array.from({length:7},()=>({...all}))}}
function sleepFor(date){const c=sleepCfg(),d=c.perDay?(c.days[parse(date).getDay()]||c.all):c.all;return{w:+d.w,b:+d.b}}
function awake(date){const{w,b}=sleepFor(date||state.date);return b>w?[w,Math.min(b,1440)]:[420,1380]}
function sleepEventFor(n){
  const b=sleepFor(n).b,nx=addDays(n,1),w=sleepFor(nx).w;
  const ev=b<1440?{date:n,time:fromMin(b),endTime:fromMin(w),endNext:true}:(w>b-1440?{date:nx,time:fromMin(b-1440),endTime:fromMin(w),endNext:false}:null);
  if(!ev)return null;return{...ev,title:'就寝',memo:'',special:false,sleepNight:n};
}
const sleepSig=e=>`${e.date}|${e.time}|${e.endTime}|${!!e.endNext}`;
function autoApplySleep(date){
  const c=sleepCfg();if(!c.auto||!date||date<today())return false;
  const ap={...(state.meta.sleepApplied||{})};let ch=false;
  [addDays(date,-1),date].forEach(n=>{if(n<addDays(today(),-1)||ap[n])return;ap[n]=true;ch=true;
    if(state.events.some(e=>alive(e)&&e.sleepNight===n))return;const ev=sleepEventFor(n);if(!ev)return;
    const o={id:uid(),...ev};o.sleepSig=sleepSig(o);upsert(state.events,'events',o)});
  if(ch){const keep=addDays(today(),-7);Object.keys(ap).forEach(k=>{if(k<keep)delete ap[k]});setMeta('sleepApplied',ap)}
  return ch;
}
/* 設定を変えたら、手を加えていない今日以降の就寝予定を作り直す */
function resyncSleep(){
  const ap={...(state.meta.sleepApplied||{})},from=today();
  state.events.filter(e=>alive(e)&&e.sleepNight&&e.sleepNight>=from&&e.sleepSig===sleepSig(e)).forEach(e=>{softDelete(state.events,'events',e.id);delete ap[e.sleepNight]});
  Object.keys(ap).forEach(k=>{if(k>=from&&!state.events.some(e=>alive(e)&&e.sleepNight===k))delete ap[k]});
  setMeta('sleepApplied',ap);
}
function freeGaps(segs,date){
  const [A,B]=awake(date),g=[];let c=A;
  unionSegs(segs).forEach(([s,e])=>{if(e<=A||s>=B)return;s=Math.max(s,A);e=Math.min(e,B);if(s-c>=15)g.push([c,s]);c=Math.max(c,e)});
  if(B-c>=15)g.push([c,B]);return g;
}
function renderSchedule(){
  const list=eventsOn(state.date),linked=new Set(state.entries.filter(alive).map(e=>e.fromEventId).filter(Boolean));
  const segs=daySegs(state.date),carry=segs.filter(x=>x.cont);
  const busy=unionSegs(segs.filter(x=>!x.e.sleepNight)).reduce((a,[s,e])=>a+(e-s),0);
  const gaps=freeGaps(segs,state.date),free=gaps.reduce((a,[s,e])=>a+(e-s),0);
  const isT=state.date===today(),nowM=(()=>{const d=new Date();return d.getHours()*60+d.getMinutes()})();
  const title=e=>`${e.sleepNight?`<span class="sl-ic">${icon('moon')}</span>`:''}${e.special?'<i class="sp-dot" title="特別な予定"></i>':''}${esc(e.title)}${linked.has(e.id)?'<span class="linked">記録済み</span>':''}`;
  const sum=`<p class="sum">${busy?`予定 <b>${fmtDur(busy)}</b>　`:''}自由時間 <b>${fmtDur(free)}</b></p>`;
  const tplBtn=`<button type="button" class="tpl-apply" data-tplapply>${icon('repeat')}テンプレートを入れる</button>`;
  if(!list.length&&!carry.length){$('#sched').innerHTML=`${sum}<p class="empty">予定はありません。</p>${tplBtn}`;return}
  const P=m=>m/14.4;

  /* スマホ：一日の帯＋一覧 */
  const strip=`<div class="strip" aria-hidden="true">${gaps.map(([s,e])=>`<i class="fr" style="left:${P(s)}%;width:${P(e-s)}%"></i>`).join('')}${segs.map(x=>`<i style="left:${P(x.s)}%;width:${P(Math.max(x.en-x.s,15))}%"></i>`).join('')}${isT?`<i class="now" style="left:${P(nowM)}%"></i>`:''}</div><div class="ticks num"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div>`;
  const row=(e,cont)=>{const d=cont?toMin(e.endTime):evDur(e);
    return `<li><button type="button" data-event="${e.id}"><span class="t num${e.time?'':' allday'}">${cont?'00:00':(e.time||'終日')}${e.time&&e.endTime?`<small class="t-end">〜${cont?e.endTime:endLabel(e)}</small>`:''}</span><span class="ttl">${cont?'<span class="cont">前日から</span>':''}${title(e)}${e.memo&&!cont?`<span class="memo">${esc(e.memo)}</span>`:''}</span><span class="dur num">${d>0?fmtDur(d):''}</span></button></li>`};
  const allday=list.filter(e=>!e.time);
  const sview=`<div class="sv-s">${sum}${strip}<ul class="sched">${allday.map(e=>row(e,false)).join('')}${carry.map(x=>row(x.e,true)).join('')}${list.filter(e=>e.time).map(e=>row(e,false)).join('')}</ul></div>`;

  /* タブレット・PC：時間軸タイムライン（空き時間は自由時間として表示） */
  const PX=44,[A,B]=awake(state.date);
  const slTop=segs.find(x=>x.e.sleepNight&&x.s<A),slBot=segs.find(x=>x.e.sleepNight&&x.s>=B&&!x.cont);
  const items=segs.filter(x=>x!==slTop&&x!==slBot).map(x=>({...x}));
  const groups=[];let cur=[],curEnd=-1;
  items.forEach(it=>{if(cur.length&&it.s>=curEnd){groups.push(cur);cur=[];curEnd=-1}cur.push(it);curEnd=Math.max(curEnd,it.en)});if(cur.length)groups.push(cur);
  groups.forEach(g=>{const cols=[];g.forEach(it=>{let c=cols.findIndex(x=>x<=it.s);if(c<0){c=cols.length;cols.push(0)}cols[c]=it.en;it.col=c});g.forEach(it=>it.n=cols.length)});
  let sH=Math.floor(Math.min(A,...items.map(i=>i.s))/60),eH=Math.ceil(Math.max(B,...items.map(i=>i.en))/60);
  if(isT){sH=Math.min(sH,Math.floor(nowM/60));eH=Math.max(eH,Math.ceil((nowM+1)/60))}
  sH=Math.max(0,sH);eH=Math.min(24,eH);
  let h='';for(let i=sH;i<=eH;i++)h+=`<div class="tl-h" style="top:${(i-sH)*PX}px"><span class="num">${i}:00</span></div>`;
  h+=gaps.map(([s,e])=>{const ht=(e-s)/60*PX-3;return `<div class="tl-free" style="top:${(s-sH*60)/60*PX+1}px;height:${ht}px">${ht>=18?`<span class="num">自由時間 ${fmtDur(e-s)}</span>`:''}</div>`}).join('');
  h+=items.map(it=>{const top=(it.s-sH*60)/60*PX,ht=Math.max(22,(it.en-it.s)/60*PX-3),short=ht<40,e=it.e;
    const tm=it.cont?`00:00〜${e.endTime}`:`${e.time}${e.endTime?'〜'+endLabel(e):''}`,d=it.cont?it.en-it.s:evDur(e);
    return `<button type="button" class="tl-b${it.noend?' noend':''}${it.cont?' cont':''}${short?' short':''}" data-event="${e.id}" style="top:${top+1}px;height:${ht}px;left:calc(${it.col/it.n*100}% + 6px);width:calc(${100/it.n}% - 10px)"><b>${it.cont?'（前日から）':''}${title(e)}</b><small class="num">${tm}${d>0?'　'+fmtDur(d):''}</small></button>`}).join('');
  if(isT&&nowM>=sH*60&&nowM<=eH*60)h+=`<div class="tl-now" style="top:${(nowM-sH*60)/60*PX}px" aria-hidden="true"></div>`;
  const slB=(x,top)=>x?`<button type="button" class="tl-sleep" data-event="${x.e.id}">${icon('moon')}<span>${top?`起床 <b class="num">${x.e.endTime}</b>`:`就寝 <b class="num">${x.e.time}</b>`}</span><small class="num">${top?(x.cont?'前日の夜から':`${x.e.time}〜`):`〜${endLabel(x.e)}`}</small></button>`:'';
  const tview=items.length||gaps.length?`${slB(slTop,true)}<div class="tl" style="height:${(eH-sH)*PX}px">${h}</div>${slB(slBot,false)}`:'';
  const ad=allday.length?`<div class="allday-row">${allday.map(e=>`<button type="button" class="allday-b" data-event="${e.id}"><span class="t allday">終日</span>${title(e)}</button>`).join('')}</div>`:'';
  $('#sched').innerHTML=sview+`<div class="sv-t">${sum}${ad}${tview}</div>`+tplBtn;
}

const toMin=v=>{const[h,m]=v.split(':').map(Number);return h*60+m};
const fromMin=n=>{n=Math.max(0,Math.min(1435,n));return `${pad(Math.floor(n/60))}:${pad(n%60)}`};
function nextHour(){const d=new Date();return fromMin((d.getHours()+1)*60)}
function tpHTML(id,val){

    <div class="seg" role="radiogroup" aria-label="午前・午後"><button type="button" class="seg-b${pm?'':' is-on'}" role="radio" aria-checked="${!pm}" data-ap="am">午前</button><button type="button" class="seg-b${pm?' is-on':''}" role="radio" aria-checked="${pm}" data-ap="pm">午後</button></div>
    <div class="tp-blocks"><button type="button" class="tp-b" data-open="h" aria-label="時を選ぶ"><b class="num" data-v="h">${h%12}</b><small>時</small></button><span class="tp-colon">:</span><button type="button" class="tp-b" data-open="m" aria-label="分を選ぶ"><b class="num" data-v="m">${pad(m)}</b><small>分</small></button></div>
    <div class="tp-grid" data-grid hidden></div></div>`;
}
function tpMount(el){
  const grid=$('[data-grid]',el);let open=null;
  const fire=()=>el.dispatchEvent(new Event('tpchange'));
  const mark=()=>$$('[data-open]',el).forEach(b=>b.classList.toggle('is-open',b.dataset.open===open));
  const show=()=>{const h=+el.dataset.h,m=+el.dataset.m;$('[data-v=h]',el).textContent=h%12;$('[data-v=m]',el).textContent=pad(m);
    $$('[data-ap]',el).forEach(b=>{const on=(b.dataset.ap==='pm')===(h>=12);b.classList.toggle('is-on',on);b.setAttribute('aria-checked',on)})};
  const openGrid=k=>{if(open===k){open=null;grid.hidden=true;mark();return}open=k;const h=+el.dataset.h,m=+el.dataset.m;
    const items=[...Array(12).keys()].map(i=>k==='h'?{v:i,l:String(i),on:h%12===i}:{v:i*5,l:pad(i*5),on:m===i*5});
    grid.innerHTML=items.map(x=>`<button type="button" class="tp-o num${x.on?' is-on':''}" data-pick-v="${x.v}">${x.l}</button>`).join('');grid.hidden=false;mark()};
  el.addEventListener('click',e=>{const t=e.target.closest('[data-ap],[data-open],[data-pick-v]');if(!t)return;

    const v=+t.dataset.pickV;if(open==='h')el.dataset.h=v+(+el.dataset.h>=12?12:0);else el.dataset.m=v;
    open=null;grid.hidden=true;mark();show();fire()});
  return{get:()=>`${pad(+el.dataset.h)}:${pad(+el.dataset.m)}`,set:v=>{const[h,m]=v.split(':').map(Number);el.dataset.h=h;el.dataset.m=m;show()}};
}

function compress(file,max){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
  const draw=max=>{const r=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.85)};
  res({full:draw(max||1600),thumb:draw(480),createdAt:nowIso()})};img.src=fr.result};fr.readAsDataURL(file)})}

function viewPhoto(src){
  const v=document.createElement('div');v.className='pv';v.setAttribute('role','dialog');v.setAttribute('aria-modal','true');v.setAttribute('aria-label','写真');
  v.innerHTML=`<img src="${src}" alt="写真"><button type="button" class="pv-x" aria-label="閉じる">${icon('close')}</button>`;
  const close=()=>{document.removeEventListener('keydown',key,true);v.remove()},key=e=>{if(e.key==='Escape'){e.stopPropagation();e.preventDefault();close()}};
  v.onclick=close;document.addEventListener('keydown',key,true);document.body.appendChild(v);$('.pv-x',v).focus();
}

let mvAnim=false,mvSuppress=false;
const mvReduce=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function mvShift(n){const d=new Date(state.view.y,state.view.m+n,1);state.view={y:d.getFullYear(),m:d.getMonth()};renderMonthAll()}
function mvSlide(n,from=0){
  const g=$('#mvGrid');
  if(mvAnim)return;
  if(mvReduce()||!g.animate){g.style.transform='';mvShift(n);return}
  mvAnim=true;const w=g.clientWidth||320;
  const out=g.animate([{transform:`translateX(${from}px)`,opacity:1},{transform:`translateX(${-n*w*0.55}px)`,opacity:0}],{duration:160,easing:'cubic-bezier(.4,0,1,1)'});
  g.style.transform='';
  out.onfinish=()=>{
    mvShift(n);
    const inn=g.animate([{transform:`translateX(${n*w*0.55}px)`,opacity:0},{transform:'translateX(0)',opacity:1}],{duration:300,easing:'cubic-bezier(.2,.85,.25,1)'});
    $('#mvTitle').animate([{opacity:0,transform:`translateX(${n*18}px)`},{opacity:1,transform:'translateX(0)'}],{duration:300,easing:'cubic-bezier(.2,.85,.25,1)'});
    $('#mvImg').animate([{opacity:.25},{opacity:1}],{duration:360,easing:'ease-out'});
    inn.onfinish=()=>{mvAnim=false};
  };
}

  $('#mvClose').onclick=()=>closeMonthView();
  $('#mvPic').onclick=openMonthImage;
  const card=$('.mv-card'),g=$('#mvGrid');let p=null;
  card.addEventListener('pointerdown',e=>{if(mvAnim||e.button>0||e.target.closest('.mv-btn'))return;p={id:e.pointerId,x:e.clientX,y:e.clientY,t:performance.now(),dir:null,dx:0,head:!!e.target.closest('.mv-head')}});
  card.addEventListener('pointermove',e=>{if(!p||e.pointerId!==p.id)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;
    if(!p.dir){if(Math.hypot(dx,dy)<8)return;p.dir=Math.abs(dx)>Math.abs(dy)?'h':'v';if(p.dir==='h'){try{card.setPointerCapture(e.pointerId)}catch(_){}}}
    if(p.dir==='h'){p.dx=dx;g.style.transform=`translateX(${dx}px)`;g.style.opacity=String(Math.max(.55,1-Math.abs(dx)/(g.clientWidth*1.6)))}});
  const end=e=>{if(!p||e.pointerId!==p.id)return;const q=p;p=null;g.style.opacity='';
    if(q.dir==='h'){mvSuppress=true;setTimeout(()=>{mvSuppress=false},0);
      const v=Math.abs(q.dx)/Math.max(1,performance.now()-q.t);
      if(Math.abs(q.dx)>g.clientWidth*0.18||(Math.abs(q.dx)>30&&v>0.45))mvSlide(q.dx<0?1:-1,q.dx);
      else{g.style.transform='';if(g.animate&&!mvReduce())g.animate([{transform:`translateX(${q.dx}px)`},{transform:'translateX(0)'}],{duration:240,easing:'cubic-bezier(.2,.85,.25,1)'})}}
    else if(q.dir==='v'&&q.head&&e.clientY-q.y>80)closeMonthView()};
  card.addEventListener('pointerup',end);card.addEventListener('pointercancel',end);
  card.addEventListener('click',e=>{if(mvSuppress){e.stopPropagation();e.preventDefault()}},true);
}

  {id:'standard',name:'スタンダード',desc:'基本の見た目。7つの色から選べます'},
  {id:'fantasy',name:'ファンタジー',desc:'旅の手帳。紙色・深緑・古い金色'},
  {id:'cyber',name:'サイバーパンク',desc:'端末ログ。濃紺・シアン・マゼンタ'},
  {id:'retro',name:'レトロ',desc:'ミルク色・ミント・チェリー色'},
  {id:'moon',name:'ムーンリット',desc:'夜空の紫・月明かり・淡い金色'}
];
let minchoLoaded=false;
function loadMincho(){if(minchoLoaded)return;minchoLoaded=true;try{const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap';document.head.appendChild(l)}catch(e){}}
function applyStyle(id){
  if(!STYLES.some(t=>t.id===id))id='standard';
  const r=document.documentElement;
  if(id==='standard')r.removeAttribute('data-style');else r.setAttribute('data-style',id);
  if(id==='fantasy'||id==='retro'||id==='moon')loadMincho();
  try{localStorage.setItem('sd-style',id)}catch(e){}
  try{const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',getComputedStyle(r).getPropertyValue('--bg').trim())}catch(e){}
}
const curStyle=()=>state.meta.styleTheme||'standard';
function styleSec(){
  loadMincho();const cur=curStyle();
  const prev=id=>`<div class="sp"${id==='standard'?'':` data-sp="${id}"`} aria-hidden="true"><div class="sp-hd">11月24日<small>火</small></div><div class="sp-h">スケジュール</div><div class="sp-row"><b>12:30</b>昼休みに読書</div><div class="sp-card"><i>映画</i>映画を1本</div><div class="sp-btn"></div></div>`;
  const colors=cur==='standard'?`<div class="st-colors"><h3 class="set-sub">スタンダードの色</h3><p class="set-note">読んだ・観たの色は、どの色でも緑と茶のままです。</p>${colorList()}</div>`:'';
  return `<p class="set-note">画面の書体・飾り・質感が変わります。スタンダードを選ぶと、色をさらに選べます。背景画像はどのテーマでも使えます。</p><div class="st-list" role="radiogroup" aria-label="テーマ">${STYLES.map(t=>`<button type="button" role="radio" class="st-opt${t.id===cur?' is-on':''}" aria-checked="${t.id===cur}" data-style-pick="${t.id}">${prev(t.id)}<span class="st-opt-name">${t.name}<small>${t.desc}</small><span class="ck">${icon('check')}</span></span></button>`).join('')}</div>${colors}`;
}
function mountStyle(s){
  mountTheme(s);
  $$('[data-style-pick]',s).forEach(b=>b.onclick=()=>{const id=b.dataset.stylePick;if(id===curStyle())return;applyStyle(id);setMeta('styleTheme',id);applyBg();
    renderSettings();toast(`テーマを「${STYLES.find(t=>t.id===id).name}」にしました`);
    if(id==='standard'){const c=$('.st-colors');if(c)c.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}});
}

/* ---------- 背景画像 ---------- */
const BGD={bgVeil:40,bgZoom:100,bgX:50,bgY:50,bgPanel:0};
function hexLum(h){if(!/^#[0-9a-f]{6}$/i.test(h))return null;const n=parseInt(h.slice(1),16);return (.2126*(n>>16&255)+.7152*(n>>8&255)+.0722*(n&255))/255}
function measureTop(src){return new Promise((res,rej)=>{const im=new Image();im.onerror=rej;im.onload=()=>{try{
  const w=48,h=Math.max(1,Math.round(w*im.height/im.width)),c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');x.drawImage(im,0,0,w,h);const d=x.getImageData(0,0,w,Math.max(1,Math.round(h*.2))).data;
  let t=0;for(let i=0;i<d.length;i+=4)t+=(.2126*d[i]+.7152*d[i+1]+.0722*d[i+2])/255;res(t/(d.length/4))}catch(e){rej(e)}};im.src=src})}
async function refreshLum(){state.bgLum=null;const s=state.meta.bgImage;if(s){try{state.bgLum=await measureTop(s)}catch(e){}}applyBg()}
const bgv=k=>state.meta[k]??BGD[k];
function applyBg(){
  const r=document.documentElement,L=$('#bgLayer'),img=state.meta.bgImage;
  r.style.setProperty('--veil',String(bgv('bgVeil')/100));
  r.style.setProperty('--panel-a',(100-bgv('bgPanel'))+'%');
  r.style.setProperty('--bz',String(bgv('bgZoom')/100));
  r.style.setProperty('--bx',bgv('bgX')+'%');r.style.setProperty('--by',bgv('bgY')+'%');
  const url=img?`url("${img}")`:'';
  $('#bgImg').style.backgroundImage=url;
  const p=$('#bg-prev-img');if(p)p.style.backgroundImage=url;
  let hd=null;const mode=state.meta.bgText||'auto';
  if(img){if(mode!=='auto')hd=mode;else if(state.bgLum!=null){const v=bgv('bgVeil')/100,bl=hexLum(getComputedStyle(r).getPropertyValue('--bg').trim());const mix=state.bgLum*(1-v)+(bl??.9)*v;hd=mix<.55?'white':'black'}}
  if(hd)r.setAttribute('data-hd',hd);else r.removeAttribute('data-hd');
  L.hidden=!img;r.classList.toggle('has-bgimg',!!img);
}
const slider=(id,label,min,max,step,val)=>`<label class="veil" for="${id}"><span class="veil-l">${label}</span><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"><output id="${id}-out">${val}%</output></label>`;
function bgSec(){
  const img=state.meta.bgImage;
  return `<div class="data-sec"><h3>背景画像</h3><p>好きな画像を背景にできます。見本の画像を直接さわって、見せたい位置と大きさに合わせてください。文字が読みにくいときは「薄さ」を上げてください。</p>
    <div class="bg-prev-wrap"><div class="bg-prev" id="bg-prev" aria-label="背景の見本。ドラッグで移動、2本指またはホイールで拡大縮小"><div class="bg-img" id="bg-prev-img"></div><div class="bg-prev-veil"></div><span class="bg-empty" id="bg-empty"${img?' hidden':''}>画像なし</span><span class="bg-zb num" id="bg-zb"${img?'':' hidden'}>${bgv('bgZoom')}%</span></div></div>
    <p class="hint bg-howto"${img?'':' hidden'} id="bg-howto">1本指でドラッグして移動、2本指で広げる・つまむと拡大・縮小（PCはマウスホイール）</p>
    <div class="photo-btns"><label class="btn-ghost" style="color:var(--fg);font-size:.9rem;cursor:pointer">${icon('photo')}<span id="bg-lbl">${img?'画像を変える':'画像を選ぶ'}</span><input type="file" id="bg-file" accept="image/*" hidden></label><button type="button" class="btn-ghost" id="bg-rm"${img?'':' hidden'}>外す</button></div>
    <div id="bg-adj"${img?'':' hidden'}>
      ${slider('bg-veil','薄さ',0,90,5,bgv('bgVeil'))}
      ${slider('bg-panel','パネル透過',0,80,5,bgv('bgPanel'))}
      <div class="seg-row"><span class="veil-l">上部の文字</span><div class="seg" role="radiogroup" aria-label="上部の文字色">${[['auto','自動'],['black','黒'],['white','白']].map(([v,l])=>{const on=(state.meta.bgText||'auto')===v;return `<button type="button" role="radio" aria-checked="${on}" class="seg-b${on?' is-on':''}" data-hdpick="${v}">${l}</button>`}).join('')}</div></div>
      <button type="button" class="btn-ghost" id="bg-reset" style="margin-top:14px">位置と大きさを戻す</button>
    </div></div>`;
}
function mountBg(s){
  const prev=$('#bg-prev',s),rm=$('#bg-rm',s),lbl=$('#bg-lbl',s),adj=$('#bg-adj',s),empty=$('#bg-empty',s);
  try{prev.style.aspectRatio=`${window.innerWidth} / ${window.innerHeight}`}catch(e){}
  const map={'bg-veil':'bgVeil','bg-panel':'bgPanel'},zb=$('#bg-zb',s);
  const showZoom=()=>{zb.textContent=Math.round(bgv('bgZoom'))+'%'};
  const sync=()=>{const img=!!state.meta.bgImage;empty.hidden=img;rm.hidden=!img;adj.hidden=!img;zb.hidden=!img;$('#bg-howto',s).hidden=!img;lbl.textContent=img?'画像を変える':'画像を選ぶ'};
  const resetPos=()=>{['bgZoom','bgX','bgY'].forEach(k=>setMeta(k,BGD[k]));showZoom();applyBg()};
  applyBg();sync();
  $('#bg-file',s).onchange=async x=>{const f=x.target.files&&x.target.files[0];if(!f)return;try{const p=await compress(f,2400);setMeta('bgImage',p.full);resetPos();sync();refreshLum();toast('背景画像を設定しました')}catch(e){toast('この画像は読み込めませんでした')}};
  rm.onclick=()=>{setMeta('bgImage',null);applyBg();sync();toast('背景画像を外しました')};
  Object.entries(map).forEach(([id,k])=>{const r=$('#'+id,s),o=$('#'+id+'-out',s);
    r.oninput=()=>{o.textContent=r.value+'%';state.meta[k]=Number(r.value);applyBg()};
    r.onchange=()=>setMeta(k,Number(r.value))});
  $('#bg-reset',s).onclick=resetPos;
  $$('[data-hdpick]',s).forEach(b=>b.onclick=()=>{setMeta('bgText',b.dataset.hdpick);applyBg();
    $$('[data-hdpick]',s).forEach(x=>{const on=x===b;x.classList.toggle('is-on',on);x.setAttribute('aria-checked',on)})});
  /* 画像を直接さわって調整：1本指=移動、2本指=拡大縮小、ホイール=拡大縮小 */
  const pts=new Map();let drag=null,pinch=null;
  const clampP=v=>Math.min(100,Math.max(0,v)),clampZ=v=>Math.min(300,Math.max(100,v));
  const dist=()=>{const [a,b]=[...pts.values()];return Math.hypot(a.x-b.x,a.y-b.y)||1};
  const startDrag=p=>{drag={x:p.x,y:p.y,bx:bgv('bgX'),by:bgv('bgY')}};
  const save=()=>['bgX','bgY','bgZoom'].forEach(k=>setMeta(k,Math.round(bgv(k))));
  prev.addEventListener('pointerdown',e=>{if(!state.meta.bgImage)return;try{prev.setPointerCapture(e.pointerId)}catch(_){}
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1)startDrag(pts.get(e.pointerId));
    else if(pts.size===2){drag=null;pinch={d0:dist(),z0:bgv('bgZoom')}}});
  prev.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch&&pts.size>=2){state.meta.bgZoom=clampZ(pinch.z0*dist()/pinch.d0);showZoom();applyBg();return}
    if(drag){const z=bgv('bgZoom')/100;
      state.meta.bgX=clampP(drag.bx-(e.clientX-drag.x)/prev.clientWidth*100/z);
      state.meta.bgY=clampP(drag.by-(e.clientY-drag.y)/prev.clientHeight*100/z);applyBg()}});
  const end=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
    if(pts.size<2)pinch=null;
    if(pts.size===1)startDrag([...pts.values()][0]);
    if(pts.size===0){drag=null;save()}};
  prev.addEventListener('pointerup',end);prev.addEventListener('pointercancel',end);
  let wT;prev.addEventListener('wheel',e=>{if(!state.meta.bgImage)return;e.preventDefault();
    state.meta.bgZoom=clampZ(bgv('bgZoom')+(e.deltaY<0?8:-8));showZoom();applyBg();clearTimeout(wT);wT=setTimeout(save,300)},{passive:false});
}

/* ---------- ToDoリスト ---------- */
const CAT_COLORS=[{id:'green',name:'緑',c:'#3d7a5c'},{id:'brown',name:'茶',c:'#9a5a2e'},{id:'blue',name:'青',c:'#3d62a0'},{id:'purple',name:'紫',c:'#7a4a8c'},{id:'rose',name:'ローズ',c:'#a8475e'},{id:'gray',name:'グレー',c:'#6b736e'}];
const colorOf=id=>(CAT_COLORS.find(x=>x.id===id)||CAT_COLORS[5]).c;
const todoCats=()=>(state.meta.todoCats||[]).map(c=>({...c})).sort((a,b)=>a.order-b.order);
const catOf=id=>todoCats().find(c=>c.id===id)||null;
function saveCats(list){list.forEach((c,i)=>c.order=i);setMeta('todoCats',list)}
function newCat(name){
  const list=todoCats(),used=list.map(c=>c.color);
  const color=(CAT_COLORS.find(x=>!used.includes(x.id))||CAT_COLORS[list.length%CAT_COLORS.length]).id;
  const c={id:uid(),name,color,order:list.length};list.push(c);saveCats(list);return c;
}
function ensureTodoCats(){
  if(Array.isArray(state.meta.todoCats))return;
  const defs=[['買い物','brown'],['手続き','blue'],['読書・映画','green']].map(([name,color],i)=>({id:uid(),name,color,order:i}));
  const map={'洗剤を注文する':0,'ゴミ袋を買う':0,'定期券を更新する':1,'歯医者の予約を取る':1,'図書館の本を返す':2,'映画の座席を予約する':2,'読みたい本を探す':2};
  state.reminders.forEach(r=>{if(r.sample&&!r.categoryId&&map[r.title]!=null){r.categoryId=defs[map[r.title]].id;put('reminders',r)}});
  saveCats(defs);
}
function seedReminders(){
  const r=(title,done)=>upsert(state.reminders,'reminders',{id:uid(),title,date:'',time:'',categoryId:null,memo:'',done:!!done,doneAt:done?nowIso():null,sample:true});
  r('図書館の本を返す');r('洗剤を注文する');r('映画の座席を予約する');r('定期券を更新する');r('読みたい本を探す');r('ゴミ袋を買う',true);r('歯医者の予約を取る',true);
}
function renderReminders(){
  const el=$('#remList');if(!el)return;
  const cats=todoCats(),ids=new Set(cats.map(c=>c.id)),list=state.reminders.filter(alive);
  const cid=r=>ids.has(r.categoryId)?r.categoryId:'none';
  let f=state.todoFilter||'all';if(f!=='all'&&f!=='none'&&!ids.has(f))f=state.todoFilter='all';
  const inF=r=>f==='all'||cid(r)===f;
  const open=list.filter(r=>!r.done).sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt)));
  const done=list.filter(r=>r.done&&inF(r)).sort((a,b)=>String(b.doneAt||'').localeCompare(String(a.doneAt||'')));
  const cnt=k=>open.filter(r=>k==='all'||cid(r)===k).length;
  const chip=(k,label,color)=>`<button type="button" class="tf${f===k?' is-on':''}" data-tf="${k}" aria-pressed="${f===k}">${color?`<i class="cdot" style="background:${color}"></i>`:''}${esc(label)}<span class="num">${cnt(k)}</span></button>`;
  const item=r=>{const c=catOf(r.categoryId),col=c?colorOf(c.color):'var(--muted)',memo=(r.memo||'').split('\n')[0];
    return `<div class="rem${r.done?' is-done':''}" style="--cc:${col}"><button type="button" class="rem-check" data-rem-toggle="${r.id}" aria-label="${r.done?'未完了に戻す':'完了にする'}">${icon('check')}</button><button type="button" class="rem-body" data-rem="${r.id}"><span class="rem-txt"><b>${esc(r.title)}</b>${memo?`<small>${esc(memo)}</small>`:''}${(()=>{const le=nextTodoEvent(r);return le?`<small class="todo-sch num${le.date<today()?' past':''}">${icon('cal')}${mdw(le.date)} ${le.time||'終日'}</small>`:''})()}</span>${icon('chevR')}</button></div>`};
  const sec=(head,color,a)=>a.length?`<section class="rem-sec"><h2><i class="cdot" style="background:${color}"></i>${esc(head)}<span class="num">${a.length}</span></h2><div class="rem-list">${a.map(item).join('')}</div></section>`:'';
  let h='';
  if(list.some(r=>r.sample))h+=`<div class="notice"><span>サンプルのToDoを表示しています。</span><button type="button" data-clear-samples>サンプルを消す</button></div>`;
  h+=`<div class="tf-row" role="toolbar" aria-label="カテゴリで絞り込む">${chip('all','すべて')}${cats.map(c=>chip(c.id,c.name,colorOf(c.color))).join('')}${(open.some(r=>cid(r)==='none')||f==='none')?chip('none','未分類','var(--muted)'):''}<button type="button" class="tf tf-edit" data-catedit aria-label="カテゴリを編集">${icon('edit')}</button></div>`;
  if(f==='all')h+=cats.map(c=>sec(c.name,colorOf(c.color),open.filter(r=>cid(r)===c.id))).join('')+sec('未分類','var(--muted)',open.filter(r=>cid(r)==='none'));
  else{const a=open.filter(inF);if(a.length)h+=`<div class="rem-list">${a.map(item).join('')}</div>`}
  if(!open.filter(inF).length)h+=`<p class="empty">${f==='all'?'ToDoはありません。下の＋から追加できます。':'このカテゴリのToDoはありません。'}</p>`;
  if(done.length){h+=`<button type="button" class="rem-done-toggle" data-rem-done aria-expanded="${state.showDone}">完了済み<span class="num">${done.length}件</span>${icon('chevR')}</button>`;if(state.showDone)h+=`<div class="rem-list">${done.map(item).join('')}</div>`}
  el.innerHTML=h;
}
function toggleRem(id,row){
  const r=state.reminders.find(x=>x.id===id);if(!r)return;const willDone=!r.done;
  if(willDone&&row)row.classList.add('checking');
  setTimeout(()=>{r.done=willDone;r.doneAt=willDone?nowIso():null;upsert(state.reminders,'reminders',r);renderReminders();toast(willDone?'完了にしました':'未完了に戻しました')},willDone?320:0);
}
const catChips=sel=>`<label><input type="radio" name="tcat" value=""${!sel?' checked':''}>未分類</label>`+todoCats().map(c=>`<label><input type="radio" name="tcat" value="${c.id}"${c.id===sel?' checked':''}><i class="cdot" style="background:${colorOf(c.color)}"></i>${esc(c.name)}</label>`).join('');
const newCatRow=id=>`<div class="newcat"><input id="${id}" type="text" maxlength="20" placeholder="新しいカテゴリ名" aria-label="新しいカテゴリ名"><button type="button" class="btn-ghost" id="${id}-add">${icon('plus')}追加</button></div>`;
function bindNewCat(s,id,done){
  const inp=$('#'+id,s),add=()=>{const name=inp.value.trim();if(!name){inp.focus();return}
    if(todoCats().some(c=>c.name===name)){toast('同じ名前のカテゴリがあります');return}
    const c=newCat(name);inp.value='';renderReminders();done(c);toast(`「${name}」を追加しました`)};
  $('#'+id+'-add',s).onclick=add;inp.addEventListener('keydown',x=>{if(x.key==='Enter'){x.preventDefault();add()}});
}
const mdw=s=>{const d=parse(s);return `${d.getMonth()+1}月${d.getDate()}日（${DOW[d.getDay()]}）`};
const todoEvents=r=>state.events.filter(e=>alive(e)&&e.fromTodoId===r.id).sort((a,b)=>`${a.date}${a.time}`<`${b.date}${b.time}`?-1:1);
function nextTodoEvent(r){const evs=todoEvents(r),t=today();return evs.find(e=>e.date>=t)||evs[evs.length-1]||null}
function openTodoActions(id){
  const r=state.reminders.find(x=>x.id===id);if(!r)return;const c=catOf(r.categoryId),evs=todoEvents(r);
  openSheet('ToDo',`<div class="ev-detail">${c?`<span class="chip" style="background:color-mix(in srgb,${colorOf(c.color)} 14%,transparent);color:${colorOf(c.color)}"><i class="cdot" style="background:${colorOf(c.color)}"></i>${esc(c.name)}</span>`:''}<p class="big" style="margin-top:6px">${esc(r.title)}</p>${r.memo?`<p>${esc(r.memo)}</p>`:''}</div>
    ${evs.length?`<p class="group-label" style="margin-top:0">入れた予定</p><div class="todo-evs">${evs.map(e=>`<button type="button" data-goev="${e.id}"><span class="num">${mdw(e.date)}　${e.time?e.time+(e.endTime?'〜'+endLabel(e):''):'終日'}</span>${icon('chevR')}</button>`).join('')}</div>`:''}
    <div class="stack"><button type="button" class="btn-primary" id="t-sch">${icon('cal')}予定に入れる</button><button type="button" class="btn-ghost" id="t-edit">編集する</button></div>`,

    $$('[data-goev]',s).forEach(b=>b.onclick=()=>{const ev=state.events.find(x=>x.id===b.dataset.goev);if(!ev)return;closeSheet();setPage('day');go(ev.date);setPane('sched')});
  });

function openReminderForm(rm){
  const f=state.todoFilter;
  const e=rm?{...rm}:{id:uid(),title:'',date:'',time:'',categoryId:(f&&f!=='all'&&f!=='none')?f:null,memo:'',done:false};
  openSheet(rm?'ToDoを編集':'ToDoを追加',`<form class="form" id="rmForm" novalidate>
    <label>内容<input id="f-title" type="text" maxlength="80" value="${esc(e.title)}" placeholder="例：図書館の本を返す"></label>
    <div class="field-label">カテゴリ<div class="cats" id="f-cats" role="radiogroup" aria-label="カテゴリ">${catChips(catOf(e.categoryId)?e.categoryId:null)}</div>${newCatRow('f-newcat')}</div>
    <label>メモ<textarea id="f-memo" rows="2" placeholder="任意">${esc(e.memo||'')}</textarea></label>
    <div class="form-actions">${rm?'<button type="button" class="btn-danger" id="f-del">削除</button>':''}<span class="spacer"></span><button type="button" class="btn-ghost" data-close>キャンセル</button><button type="submit" class="btn-primary">保存</button></div></form>`,
  s=>{
    bindNewCat(s,'f-newcat',c=>{$('#f-cats',s).innerHTML=catChips(c.id)});
    $('#rmForm',s).onsubmit=x=>{x.preventDefault();const title=$('#f-title',s).value.trim();

const WD=['日','月','火','水','木','金','土'];
const tpls=()=>(state.meta.schedTemplates||[]).map(t=>({...t,days:[...(t.days||[])],items:(t.items||[]).map(i=>({...i}))}));
function saveTpls(list){setMeta('schedTemplates',list)}
const tplDaysText=d=>{const s=[...d].sort((a,b)=>a-b).join(',');if(!d.length)return '自動では入れない';if(s==='1,2,3,4,5')return '平日';if(s==='0,6')return '土日';if(d.length===7)return '毎日';return [...d].sort((a,b)=>((a+6)%7)-((b+6)%7)).map(x=>WD[x]).join('・')};
const itemList=t=>t.items.length?[...t.items].sort((a,b)=>toMin(a.time)-toMin(b.time)).map(i=>`${i.time} ${esc(i.title)}`).join('　'):'予定がありません';
function applyTemplate(t,date){
  const ex=state.events.filter(e=>alive(e)&&e.date===date);let n=0;
  t.items.forEach(i=>{if(ex.some(e=>e.time===i.time&&e.title===i.title))return;
    upsert(state.events,'events',{id:uid(),date,time:i.time,endTime:i.endTime,endNext:!!i.endNext,title:i.title,memo:i.memo||'',special:!!i.special,fromTemplateId:t.id});n++});
  return n;
}
function autoApplyTemplates(date){
  if(!date||date<today())return false;
  const list=tpls().filter(t=>t.auto&&t.days.includes(parse(date).getDay())&&t.items.length);if(!list.length)return false;
  const ap={...(state.meta.tplApplied||{})},done=ap[date]||[];let changed=false;
  list.forEach(t=>{if(done.includes(t.id))return;applyTemplate(t,date);done.push(t.id);changed=true});
  if(changed){ap[date]=done;const keep=addDays(today(),-7);Object.keys(ap).forEach(k=>{if(k<keep)delete ap[k]});setMeta('tplApplied',ap)}
  return changed;
}

        if(x.kind==='check'&&state.habitLogs.some(l=>alive(l)&&l.habitId===x.id&&l.date===d)){toast('その日はすでに記録済みです');return}
        addHabLog(x,d,1);closeSheet();renderHabits();toast('記録しました')}})};
  });
}
/* アイコン画像：ドラッグで位置、ピンチ・ホイールで拡大して正方形に切り抜く */
function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src})}
function cropRender(im,c,size){
  const cv=document.createElement('canvas');cv.width=cv.height=size;const g=cv.getContext('2d');
  const base=Math.max(size/im.width,size/im.height),W=im.width*base*c.z,H=im.height*base*c.z;
  g.drawImage(im,-(W-size)*c.fx,-(H-size)*c.fy,W,H);return cv.toDataURL('image/jpeg',.88);
}
function mountCrop(box,getIm,c,onEnd){
  const img=box.querySelector('img'),pts=new Map();let st=null;
  const B=()=>box.clientWidth||200,dims=()=>{const im=getIm(),b=B(),base=Math.max(b/im.width,b/im.height);return{b,W:im.width*base*c.z,H:im.height*base*c.z}};
  const draw=()=>{if(!getIm())return;const{b,W,H}=dims();img.style.width=W+'px';img.style.height=H+'px';img.style.transform=`translate(${-(W-b)*c.fx}px,${-(H-b)*c.fy}px)`};
  const cl=v=>Math.min(1,Math.max(0,v));
  const zoomTo=(z,px,py)=>{const{b,W,H}=dims(),ix=(W-b)*c.fx+px,iy=(H-b)*c.fy+py;c.z=Math.min(5,Math.max(1,z));const d=dims();
    c.fx=d.W>d.b?cl((ix*d.W/W-px)/(d.W-d.b)):.5;c.fy=d.H>d.b?cl((iy*d.H/H-py)/(d.H-d.b)):.5;draw()};
  const rel=e=>{const r=box.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  box.addEventListener('pointerdown',e=>{box.setPointerCapture(e.pointerId);pts.set(e.pointerId,rel(e));st=null;e.preventDefault()});
  box.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId)||!getIm())return;const prev=pts.get(e.pointerId),now=rel(e);
    if(pts.size===1){const{b,W,H}=dims();if(W>b)c.fx=cl(c.fx-(now[0]-prev[0])/(W-b));if(H>b)c.fy=cl(c.fy-(now[1]-prev[1])/(H-b));pts.set(e.pointerId,now);draw();return}
    pts.set(e.pointerId,now);const[a,b2]=[...pts.values()],dist=Math.hypot(a[0]-b2[0],a[1]-b2[1]),mid=[(a[0]+b2[0])/2,(a[1]+b2[1])/2];
    if(!st){st={d:dist,z:c.z};return}zoomTo(st.z*dist/st.d,mid[0],mid[1])});
  const up=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);st=null;if(!pts.size&&onEnd)onEnd()};
  box.addEventListener('pointerup',up);box.addEventListener('pointercancel',up);
  box.addEventListener('wheel',e=>{e.preventDefault();if(!getIm())return;const[x,y]=rel(e);zoomTo(c.z*(e.deltaY<0?1.1:1/1.1),x,y);clearTimeout(box._wt);box._wt=setTimeout(()=>onEnd&&onEnd(),250)},{passive:false});
  draw();return draw;
}
function openHabitForm(src){
  const isNew=!src,x=src?{...src}:{id:uid(),name:'',iconType:'preset',icon:'gym',image:null,color:'green',kind:'count',unit:'回',target:3,period:'week',order:Date.now()};
  openSheet(isNew?'日課を追加':'日課を編集',`<form class="form" id="hbForm" novalidate>
    <div class="hb-prev" id="hf-prev"></div>
    <label>名前<input id="hf-name" type="text" maxlength="30" value="${esc(x.name)}" placeholder="例：筋トレ"></label>
    <div class="field-label">アイコン<div class="hb-icons" role="radiogroup" aria-label="アイコン">${HAB_ICONS.map(i=>`<button type="button" class="hb-ipick" role="radio" data-hicon="${i[0]}" aria-label="${i[1]}" title="${i[1]}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${i[2]}</svg></button>`).join('')}</div>
    <button type="button" class="hb-imgopt hb-iimg" id="hf-imgpick" role="radio" aria-label="好きな画像を使う"><span class="hb-imgth" id="hf-imgth"></span><span class="hb-imgtx"><b>好きな画像を使う</b><small id="hf-imgsub">写真やイラストをアイコンにできます</small></span></button>
    <div class="hb-crop" id="hf-crop" hidden><div class="hb-cropbox" id="hf-cropbox"><img alt="" draggable="false"></div><div class="hb-cropside"><p class="hint" style="margin:0;font-weight:400">ドラッグで位置、2本指（PCはホイール）で拡大できます。</p><label class="btn-ghost hb-imgbtn">${icon('photo')}<span id="hf-imglbl">画像を選ぶ</span><input type="file" id="hf-img" accept="image/*" hidden></label></div></div></div>
    <div class="field-label">色<div class="hb-colors" role="radiogroup" aria-label="色">${HAB_COLORS.map(c=>`<button type="button" class="sw-b" role="radio" data-hcol="${c[0]}" aria-label="${c[0]}" style="background:${c[1]}"></button>`).join('')}</div></div>
    <div class="field-label">記録のしかた<div class="seg" role="radiogroup" aria-label="記録のしかた">${Object.entries(HAB_KINDS).map(([k,v])=>`<button type="button" class="seg-b" role="radio" data-hkind="${k}">${v.label}</button>`).join('')}</div><p class="hint" id="hf-kh" style="margin:2px 0 0;font-weight:400"></p></div>
    <div class="row2"><label>単位<input id="hf-unit" type="text" maxlength="8" value="${esc(x.unit||'')}"></label><label>目標（任意）<input id="hf-target" type="number" inputmode="decimal" min="0" step="any" value="${x.target||''}"></label></div>
    <div class="field-label">目標の期間<div class="seg" role="radiogroup" aria-label="目標の期間"><button type="button" class="seg-b" role="radio" data-hper="week">1週間に</button><button type="button" class="seg-b" role="radio" data-hper="month">1か月に</button></div></div>
    <div class="form-actions">${isNew?'':'<button type="button" class="btn-danger" id="hf-del">削除</button>'}<span class="spacer"></span><button type="button" class="btn-ghost" data-close>キャンセル</button><button type="submit" class="btn-primary">保存</button></div></form>`,
  s=>{
    const sync=()=>{
      $$('[data-hicon]',s).forEach(b=>{const on=x.iconType==='preset'&&b.dataset.hicon===x.icon;b.classList.toggle('is-on',on);b.setAttribute('aria-checked',on)});
      $('.hb-iimg',s).classList.toggle('is-on',x.iconType==='image');$('.hb-iimg',s).setAttribute('aria-checked',x.iconType==='image');$('#hf-crop',s).hidden=x.iconType!=='image';$('#hf-imglbl',s).textContent=x.imageSrc||x.image?'画像を変える':'画像を選ぶ';$('#hf-imgth',s).innerHTML=x.image?`<img src="${x.image}" alt="">`:icon('photo');$('#hf-imgsub',s).textContent=x.iconType==='image'?'使用中・下の枠で位置と大きさを調整':x.image?'押すとこの画像に切り替えます':'写真やイラストをアイコンにできます';
      $$('[data-hcol]',s).forEach(b=>{const on=b.dataset.hcol===x.color;b.classList.toggle('is-on',on);b.setAttribute('aria-checked',on)});
      $$('[data-hkind]',s).forEach(b=>{const on=b.dataset.hkind===x.kind;b.classList.toggle('is-on',on);b.setAttribute('aria-checked',on)});
      $$('[data-hper]',s).forEach(b=>{const on=b.dataset.hper===x.period;b.classList.toggle('is-on',on);b.setAttribute('aria-checked',on)});
      $('#hf-kh',s).textContent=HAB_KINDS[x.kind].hint;
      $('#hf-unit',s).disabled=x.kind==='check';
      $('#hf-prev',s).innerHTML=habIcon(x)+`<b>${esc($('#hf-name',s).value||'日課の名前')}</b>`;
    };
    sync();$('#hf-name',s).addEventListener('input',sync);
    $$('[data-hicon]',s).forEach(b=>b.onclick=()=>{x.iconType='preset';x.icon=b.dataset.hicon;const n=$('#hf-name',s);if(!n.value.trim())n.value=(HAB_ICONS.find(i=>i[0]===x.icon)||[])[1]||'';sync()});
    x.crop=x.crop?{...x.crop}:{z:1,fx:.5,fy:.5};const cbox=$('#hf-cropbox',s),cimg=$('img',cbox);let cim=null,redraw=null;
    const bake=()=>{if(cim){x.image=cropRender(cim,x.crop,256);sync()}};
    const useSrc=async src=>{const im=await loadImg(src);cim=im;cimg.src=src;if(!redraw)redraw=mountCrop(cbox,()=>cim,x.crop,bake);redraw();bake()};
    $('#hf-imgpick',s).onclick=()=>{if(x.imageSrc||x.image){x.iconType='image';sync();if(!cim)useSrc(x.imageSrc||x.image).catch(()=>{});else redraw()}else $('#hf-img',s).click()};
    $('#hf-img',s).onchange=async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;e.target.value='';
      try{const p=await compress(f,900);x.imageSrc=p.full;Object.assign(x.crop,{z:1,fx:.5,fy:.5});x.iconType='image';sync();await useSrc(x.imageSrc)}catch(err){toast('この画像は読み込めませんでした')}};
    if(x.iconType==='image'&&(x.imageSrc||x.image))setTimeout(()=>useSrc(x.imageSrc||x.image).catch(()=>{}),0);
    $$('[data-hcol]',s).forEach(b=>b.onclick=()=>{x.color=b.dataset.hcol;sync()});
    $$('[data-hkind]',s).forEach(b=>b.onclick=()=>{const prev=HAB_KINDS[x.kind].unit;x.kind=b.dataset.hkind;const u=$('#hf-unit',s);if(!u.value||u.value===prev||x.kind==='check')u.value=HAB_KINDS[x.kind].unit;sync()});
    $$('[data-hper]',s).forEach(b=>b.onclick=()=>{x.period=b.dataset.hper;sync()});
    $('#hbForm',s).onsubmit=e=>{e.preventDefault();const name=$('#hf-name',s).value.trim();if(!name){$('#hf-name',s).focus();toast('名前を入れてください');return}
      x.name=name;x.unit=x.kind==='check'?'日':($('#hf-unit',s).value.trim()||HAB_KINDS[x.kind].unit);const tg=parseFloat($('#hf-target',s).value);x.target=tg>0?tg:0;delete x.sample;
      upsert(state.habits,'habits',x);closeSheet();renderHabits();toast(isNew?'日課を追加しました':'日課を保存しました')};
    const d=$('#hf-del',s);if(d)armDelete(d,()=>{softDelete(state.habits,'habits',x.id);state.habitLogs.filter(l=>alive(l)&&l.habitId===x.id).forEach(l=>softDelete(state.habitLogs,'habitLogs',l.id));closeSheet();renderHabits();toast('日課を削除しました')});
  });
}
/* 予定から日課に記録（手動） */
function habMatch(title){const t=(title||'').replace(/\s/g,'');return habits().map(h=>({h,s:t&&(t.includes(h.name)||h.name.includes(t))?1:0})).sort((a,b)=>b.s-a.s).map(o=>o.h)}
function recordFromEvent(e,x){
  const exist=state.habitLogs.some(l=>alive(l)&&l.fromEventId===e.id&&l.habitId===x.id);
  if(exist){toast(`この予定はすでに「${x.name}」に記録済みです`);return}
  if(x.kind==='check'&&state.habitLogs.some(l=>alive(l)&&l.habitId===x.id&&l.date===e.date)){toast(`${parse(e.date).getDate()}日の「${x.name}」はすでに記録済みです`);return}
  if(x.kind==='amount'){const u=x.unit||'';const pre=/分/.test(u)&&evDur(e)>0?evDur(e):(/時間/.test(u)&&evDur(e)>0?Math.round(evDur(e)/6)/10:null);openHabAmount(x,e.date,pre,{fromEventId:e.id});return}
  addHabLog(x,e.date,1,{fromEventId:e.id});closeSheet();renderHabits();renderSchedule();toast(`「${x.name}」に記録しました`);
}
function openHabFromEvent(e){
  const list=habMatch(e.title);
  if(!list.length){openSheet('日課に記録',`<p class="hint" style="margin:0 0 14px">日課はまだありません。日課のページの＋から作れます。</p>`);return}
  openSheet('どの日課に記録しますか',`<p class="hint" style="margin:0 0 12px">「${esc(e.title)}」を${parse(e.date).getMonth()+1}月${parse(e.date).getDate()}日の記録として付けます。</p><div class="stack">${list.map(x=>`<button type="button" class="hb-pick" data-hpick="${x.id}" style="--hc:${hcol(x.color)}">${habIcon(x)}<b>${esc(x.name)}</b><small>${HAB_KINDS[x.kind].label}</small></button>`).join('')}</div>`,
  s=>$$('[data-hpick]',s).forEach(b=>b.onclick=()=>recordFromEvent(e,state.habits.find(h=>h.id===b.dataset.hpick))));
}
function seedHabits(){
  const t=today(),wk=addDays(t,-parse(t).getDay());
  let o=Date.now();const mk=(name,icon,color,kind,unit,target)=>{const h={id:uid(),name,iconType:'preset',icon,image:null,color,kind,unit,target,period:'week',order:o++,sample:true};upsert(state.habits,'habits',h);return h};
  const g=mk('筋トレ','gym','green','count','回',3),c=mk('創作','create','orange','check','日',5),b=mk('読書','book','blue','amount','ページ',50),m=mk('ゲーム','game','purple','count','面',2);
  const L=(h,d,a)=>{if(d<=t)addHabLog(h,d,a,{sample:true})};
  L(g,wk,1);L(g,addDays(wk,2),1);L(c,wk,1);L(c,addDays(wk,1),1);L(c,t,1);L(b,addDays(wk,1),12);L(b,addDays(wk,3),12);L(m,addDays(wk,2),1);
}

/* 下部のページ切り替えバー */
document.documentElement.dataset.page='day';
$('#navHab').innerHTML=icon('habit');$('#navDay').innerHTML=icon('cal');$('#navRem').innerHTML=icon('checklist');$('#navAdd').innerHTML=icon('plus');
function setPage(p){
  if(state.page===p){if(p==='day'&&state.date!==today())go(today());return}
  state.page=p;document.documentElement.dataset.page=p;
  [['navHab','habit'],['navDay','day'],['navRem','rem']].forEach(([id,v])=>{const b=$('#'+id),on=v===p;b.classList.toggle('is-on',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  renderHeader();window.scrollTo(0,0);
}
$('#navDay').onclick=()=>setPage('day');
$('#navRem').onclick=()=>setPage('rem');
$('#navHab').onclick=()=>setPage('habit');
$('#navAdd').onclick=()=>{if(state.page==='rem')return openReminderForm();if(state.page==='habit')return openHabitForm();if(window.innerWidth<600)return main.dataset.show==='rec'?openEntryChooser():openEventForm();openAddChooser()};
$('#habList').addEventListener('click',e=>{const t=e.target.closest('[data-hview],[data-hnav],[data-hact],[data-hab],[data-hadd]');if(!t)return;const ds=t.dataset;
  if(ds.hadd!==undefined){openHabitForm();return}
  if(ds.hview){state.habView=ds.hview;renderHabits();return}
  if(ds.hnav!==undefined){const n=+ds.hnav,a=parse(state.habAnchor||today());if(n===0)state.habAnchor=null;else if(state.habView==='month')state.habAnchor=ymd(new Date(a.getFullYear(),a.getMonth()+n,1));else state.habAnchor=addDays(ymd(a),7*n);renderHabits();return}
  if(ds.hact){habAct(ds.hact);return}
  if(ds.hab)openHabDetail(ds.hab)});
$('#remList').addEventListener('click',e=>{const t=e.target.closest('[data-tf],[data-catedit],[data-rem-toggle],[data-rem],[data-rem-done]');if(!t)return;
  if(t.dataset.tf){state.todoFilter=t.dataset.tf;renderReminders();return}
  if(t.dataset.catedit!==undefined){openCatManager();return}
  if(t.dataset.remToggle){toggleRem(t.dataset.remToggle,t.closest('.rem'));return}
  if(t.dataset.rem){openTodoActions(t.dataset.rem);return}
  state.showDone=!state.showDone;renderReminders()});

async function init(){
  let saved='auto';try{saved=localStorage.getItem('sd-theme')||'auto'}catch(e){}
  let savedSt='standard';try{savedSt=localStorage.getItem('sd-style')||'standard'}catch(e){}
  applyStyle(savedSt);
  applyTheme(saved);
  setView(state.date);render();
  idb=await openDB();
  const [ev,en,ph,meta,rms,hbs,hls]=await Promise.all(STORES.map(getAll));
  state.events=ev;state.entries=en;state.reminders=rms;state.habits=hbs;state.habitLogs=hls;ph.forEach(p=>state.photos.set(p.id,p));state.meta={};meta.forEach(m=>state.meta[m.id]=m.value);
  if(state.meta.theme)applyTheme(state.meta.theme);
  if(state.meta.styleTheme)applyStyle(state.meta.styleTheme);
  applyBg();refreshLum();
  if(!state.meta.seeded){seedSamples();setMeta('seeded',true)}
  if(!state.meta.seededRem){seedReminders();setMeta('seededRem',true)}
  if(!state.meta.seededHab){seedHabits();setMeta('seededHab',true)}
  ensureTodoCats();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}
  render();
}
init();
})();
